# CoreForge Alertmanager — routes coreforge's alerts to ITS OWN Discord
# channel, independent from any other stack on the host.
#
# The webhook URL is NOT here: coreforge-alertmanager-init writes
# $COREFORGE_DISCORD_WEBHOOK_URL (from the env file on the host) into the file
# referenced below, so no secret lives in git. If the webhook is unset the
# receiver just fails to deliver — alerts remain visible in Prometheus/Grafana.

route:
    receiver: discord
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
        # Critical alerts re-notify more often.
        - matchers:
              - severity = "critical"
          repeat_interval: 1h

receivers:
    - name: discord
      discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] coreforge · {{ .CommonLabels.alertname }}'
            message: |-
                {{ range .Alerts }}**{{ .Labels.severity | toUpper }}**
                {{ .Annotations.summary }}
                {{ .Annotations.description }}
                {{ end }}

# A critical alert silences the matching warning for the same alert.
inhibit_rules:
    - source_matchers:
          - severity = "critical"
      target_matchers:
          - severity = "warning"
      equal: ['alertname']
