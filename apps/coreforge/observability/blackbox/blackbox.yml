# CoreForge blackbox-exporter modules — SINGLE SOURCE shared by dev/staging/prod.
#
# Prometheus asks this exporter to probe a target (?target=…&module=…) and
# scrapes the result: probe_success, probe_duration_seconds, probe_http_*, etc.
# It probes the app's REAL request path (`/api/healthz`) end-to-end, which is a
# stronger liveness signal than the `up` scrape metric: `up` only means /metrics
# is scrapeable, whereas a blackbox probe exercises the actual HTTP handler.
#
# No `icmp` module here (unlike the central pi-infra blackbox) — coreforge only
# probes HTTP endpoints on the docker network, so no NET_RAW capability is
# needed and the exporter runs with cap_drop: ALL like the rest of the stack.
modules:
    http_2xx:
        prober: http
        timeout: 5s
        http:
            preferred_ip_protocol: ip4
            valid_status_codes: [] # defaults to 2xx
            follow_redirects: false

    tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
            preferred_ip_protocol: ip4
