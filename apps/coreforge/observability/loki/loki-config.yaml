# Single-binary Loki for CoreForge (filesystem storage). Shared by
# dev / staging / prod — service names are unified to `coreforge-*`.
auth_enabled: false

server:
    http_listen_port: 3100
    grpc_listen_port: 9096
    log_level: warn

common:
    instance_addr: 127.0.0.1
    path_prefix: /loki
    storage:
        filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory

schema_config:
    configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h

limits_config:
    # Structured metadata carries trace_id on OTLP-ingested lines (browser RUM
    # logs arrive via Alloy's OTLP receiver → Loki's native /otlp endpoint).
    allow_structured_metadata: true
    retention_period: 168h

query_range:
    results_cache:
        cache:
            embedded_cache:
                enabled: true
                max_size_mb: 100
