# ─────────────────────────────────────────────────────────────
# CoreForge — full PROD stack for the shared Raspberry Pi (pi-infra).
#
# Self-contained: app + its OWN observability (prometheus / loki / tempo /
# alloy) + its OWN alerting (alertmanager → coreforge's Discord, independent
# from the core channel).
#
# Every service is prefixed `coreforge-` and joins the external `monitoring`
# network so the CENTRAL Grafana (pi-infra core) can query this stack's
# Prometheus / Loki / Tempo / Alertmanager as the `*-coreforge` datasources.
# No Grafana here — the core owns it. No host ports — everything is reached by
# DNS on `monitoring`; the app and Alloy's RUM endpoint are exposed through
# nginx-proxy-manager (core):
#   coreforge-conveyor-filters.negri.es       → http://coreforge-app:4321
#   otlp.coreforge-conveyor-filters.negri.es  → http://coreforge-alloy:4318
#     └ custom location /collect              → http://coreforge-alloy:12347 (Faro RUM)
#
# This folder is the source of truth in the coreforge repo (infra/prod/) and is
# synced into pi-infra/apps/coreforge/prod/ by the sync-pi-infra action.
# Secrets live in coreforge.env on the Pi only (gitignored; see
# coreforge.env.example).
# ─────────────────────────────────────────────────────────────
name: coreforge

x-obs-common: &obs-common
    networks: [coreforge-net, monitoring]
    restart: unless-stopped
    logging:
        driver: json-file
        options: { max-size: '10m', max-file: '3' }

services:
    # ── App ──────────────────────────────────────────────────────
    # Pulled from Docker Hub (built by .github/workflows/docker-publish.yml on
    # version bumps).
    coreforge-app:
        image: negrii/coreforge-conveyor-filters:latest
        container_name: coreforge-app
        pull_policy: always
        env_file:
            - path: ./coreforge.env
              required: false
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: '4321'
            DATA_DIR: /data

            # --- OpenTelemetry → Tempo (traces only) ----------------------
            # Logs go to stdout as JSON (Alloy tails the container → Loki) and
            # metrics are scraped from /metrics by this stack's Prometheus.
            OTEL_EXPORTER_OTLP_ENDPOINT: http://coreforge-tempo:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            # sdk-node defaults these to "otlp" when unset, which would push
            # metrics/logs at Tempo and 404 — this stack is traces-only OTLP.
            OTEL_METRICS_EXPORTER: none
            OTEL_LOGS_EXPORTER: none
            OTEL_SERVICE_NAME: coreforge
            OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=coreforge,deployment.environment=production'
            OTEL_LOG_LEVEL: error

            # Trace sampling: keep 10% of browser-initiated traces.
            # `parentbased_traceidratio` respects upstream sampling decisions,
            # so a trace sampled by the browser SDK is fully recorded on the
            # backend too — no orphan spans.
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: '0.1'

            # Browser RUM — Grafana Faro (Alloy's CORS-gated faro.receiver via
            # NPM: custom location /collect → coreforge-alloy:12347 over the
            # `monitoring` network). Unset to disable RUM.
            FARO_COLLECTOR_URL: https://otlp.coreforge-conveyor-filters.negri.es/collect
            FARO_APP_NAME: coreforge-web

            # GRAFANA_URL (admin shortcut button on /admin) and the rest of the
            # app secrets come from coreforge.env via env_file above.

        volumes:
            - coreforge-data:/data

        # --- Hardening ---------------------------------------------------
        user: 'node'
        init: true # PID-1 signal forwarding + zombie reaping
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # Root FS is immutable; the only persistent writable path is /data.
        read_only: true
        tmpfs:
            - /tmp:size=64m
            - /app/.astro:uid=1000,gid=1000,size=16m

        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:'+process.env.PORT+'/api/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

        deploy:
            resources:
                limits: { cpus: '1.0', memory: 512m }
        logging:
            driver: json-file
            options: { max-size: '10m', max-file: '3' }
        # coreforge-net: scraped by prometheus + pushes OTLP to tempo.
        # monitoring: reachable by nginx-proxy-manager (core).
        networks: [coreforge-net, monitoring]
        restart: unless-stopped
        labels:
            - homepage.group=Apps
            - homepage.name=CoreForge
            - homepage.icon=mdi-anvil
            - homepage.href=https://coreforge-conveyor-filters.negri.es/
            - homepage.docker.container=coreforge-app
            - homepage.widget.type=customapi
            - homepage.widget.url=http://coreforge-app:4321/api/healthz

    # ── Observability (metrics / logs / traces) ──────────────────
    coreforge-prometheus:
        <<: *obs-common
        image: prom/prometheus:v3.5.0
        container_name: coreforge-prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--storage.tsdb.retention.size=1GB'
            - '--web.enable-lifecycle'
            # Tempo's metrics_generator remote-writes span-metrics + service graph here.
            - '--web.enable-remote-write-receiver'
            # Store trace exemplars so latency panels can link to traces.
            - '--enable-feature=exemplar-storage'
        volumes:
            # Shared single-source obs configs (../observability) + per-env scrape.d.
            - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ../observability/prometheus/rules:/etc/prometheus/rules:ro
            - ./scrape.d:/etc/prometheus/scrape.d:ro
            - prometheus-data:/prometheus
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 512m }

    coreforge-loki:
        <<: *obs-common
        image: grafana/loki:3.5.0
        container_name: coreforge-loki
        command: ['-config.file=/etc/loki/loki-config.yaml']
        volumes:
            - ../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
            - loki-data:/loki
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 384m }

    coreforge-tempo:
        <<: *obs-common
        image: grafana/tempo:2.8.1
        container_name: coreforge-tempo
        command: ['-config.file=/etc/tempo/tempo.yaml']
        volumes:
            - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 384m }

    coreforge-alloy:
        <<: *obs-common
        image: grafana/alloy:v1.9.2
        container_name: coreforge-alloy
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
        volumes:
            - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - alloy-data:/var/lib/alloy/data
        depends_on:
            - coreforge-loki
            - coreforge-tempo
        deploy:
            resources:
                limits: { cpus: '0.25', memory: 128m }

    # ── Liveness probes (blackbox) ───────────────────────────────
    # Prometheus drives this exporter to probe HTTP endpoints and records
    # probe_success / probe_duration_seconds. Targets are defined in
    # prometheus.yml (obs readiness) + scrape.d/ (the app's /api/healthz).
    coreforge-blackbox:
        <<: *obs-common
        image: prom/blackbox-exporter:v0.27.0
        container_name: coreforge-blackbox
        command: ['--config.file=/etc/blackbox/blackbox.yml']
        volumes:
            - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
        deploy:
            resources:
                limits: { cpus: '0.1', memory: 64m }

    # ── Alerting (independent from core; own Discord channel) ─────
    # Writes COREFORGE_DISCORD_WEBHOOK_URL (from coreforge.env) into a secret
    # file so Alertmanager reads it via webhook_url_file — the secret stays out
    # of git.
    coreforge-alertmanager-init:
        image: busybox:1.37
        container_name: coreforge-alertmanager-init
        env_file:
            - path: ./coreforge.env
              required: false
        command:
            - sh
            - -c
            - 'printf "%s" "$$COREFORGE_DISCORD_WEBHOOK_URL" > /secrets/discord_webhook_url && echo "wrote coreforge discord webhook secret"'
        volumes:
            - alertmanager-secrets:/secrets
        networks: [coreforge-net]
        restart: 'no'

    coreforge-alertmanager:
        <<: *obs-common
        image: prom/alertmanager:v0.28.1
        container_name: coreforge-alertmanager
        command:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
        volumes:
            - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
            - alertmanager-secrets:/etc/alertmanager/secrets:ro
            - alertmanager-data:/alertmanager
        depends_on:
            coreforge-alertmanager-init:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '0.25', memory: 128m }

volumes:
    # Adopts the pre-existing data volume (SQLite DB + WAL). `external: true`
    # says "don't create — use the one that's already there". On a FRESH host,
    # create it first:  docker volume create coreforge-conveyor-filters_coreforge-data
    # then copy coreforge.prod.db into it before first start.
    coreforge-data:
        name: coreforge-conveyor-filters_coreforge-data
        external: true
    prometheus-data:
        name: coreforge-prometheus-data
    loki-data:
        name: coreforge-loki-data
    tempo-data:
        name: coreforge-tempo-data
    alloy-data:
        name: coreforge-alloy-data
    alertmanager-data:
        name: coreforge-alertmanager-data
    alertmanager-secrets:
        name: coreforge-alertmanager-secrets

networks:
    # Private: app ↔ its own observability + alerting.
    coreforge-net:
        name: coreforge-net
    # Shared, created once by pi-infra's scripts/create-network.sh — joined, not created.
    monitoring:
        external: true
        name: monitoring
