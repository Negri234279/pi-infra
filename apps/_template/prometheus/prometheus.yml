# Per-app Prometheus — scrapes ONLY this app's business metrics.
#
# Host/container resource metrics are NOT scraped here: node-exporter + cadvisor in
# the core stack already cover the Pi and every container. Keep this file focused on
# the app's own /metrics endpoint(s).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: myapp

# Extra jobs dropped in scrape.d/ (e.g. Blackbox liveness probes for this app —
# see docs/app-blackbox-probes.md). Each file is a mapping with a `scrape_configs`
# key, NOT a bare list. The dir is mounted in compose; an empty dir is fine.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  - job_name: myapp
    static_configs:
      - targets: ["myapp:8080"]   # app's /metrics host:port on the private network
