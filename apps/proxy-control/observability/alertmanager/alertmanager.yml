# Alertmanager de proxy-control → su propio canal de Discord (independiente del core).
# El webhook NO va aquí: proxy-control-alertmanager-init escribe
# $PROXY_CONTROL_DISCORD_WEBHOOK_URL (de proxy-control.env) en el fichero de abajo,
# así el secreto no vive en git. En dev el webhook es opcional.

route:
    receiver: discord
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
        - matchers:
              - severity = "critical"
          repeat_interval: 1h

receivers:
    - name: discord
      discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] proxy-control · {{ .CommonLabels.alertname }}'
            message: |-
                {{ range .Alerts }}**{{ .Labels.severity | toUpper }}**
                {{ .Annotations.summary }}
                {{ .Annotations.description }}
                {{ end }}

inhibit_rules:
    - source_matchers:
          - severity = "critical"
      target_matchers:
          - severity = "warning"
      equal: ['alertname']
