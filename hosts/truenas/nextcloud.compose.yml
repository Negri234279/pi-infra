# Nextcloud — private "Drive" running ON the NAS (self-contained: own Postgres + Redis, so it does
# NOT depend on the hub's shared Postgres being up). LAN/VPN only — no public exposure. Deployed by
# ansible/roles/truenas_nextcloud, which syncs this file + a gitignored .env to the nextcloud
# dataset and runs `docker compose up -d`. Files live on ZFS (snapshots), close to the pool.
#
# Bind mounts are RELATIVE to this file's location ({{ truenas_nextcloud_dir }} = /mnt/<pool>/
# nextcloud): ./html (app+config), ./data (user files); the DB uses the sibling dataset
# ../nextcloud-db. Secrets/domains/port come from .env (see nextcloud.env.example).
services:
  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ../nextcloud-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
    networks: [nextcloud]

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${NEXTCLOUD_REDIS_PASSWORD:?set NEXTCLOUD_REDIS_PASSWORD in .env}"]
    networks: [nextcloud]

  nextcloud:
    # Fresh install tracks the maintained stable tag. NOTE: Nextcloud MAJOR upgrades must be done
    # one release at a time — once installed, pin a major (e.g. nextcloud:31-apache) and bump it
    # deliberately, never skip versions.
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on: [nextcloud-db, nextcloud-redis]
    ports:
      # Listens on ALL interfaces (LAN/VPN only — no public exposure), so it is reachable at both
      # http://192.168.1.18:${NEXTCLOUD_PORT} (mgmt LAN / WireGuard) and
      # http://10.10.10.13:${NEXTCLOUD_PORT} (10 GbE isolated link — use this for max LAN speed).
      # Both IPs must be in NEXTCLOUD_TRUSTED_DOMAINS.
      - "${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - ./html:/var/www/html
      - ./data:/var/www/html/data
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?}
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD:?}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      # Space-separated hostnames/IPs allowed to serve the UI. Include the LAN IP, any internal DNS
      # name, and your WireGuard subnet address if you reach it over VPN.
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-192.168.1.18 10.10.10.13 nas.negri.es}
      # Protocol handling. LEAVE OVERWRITEPROTOCOL EMPTY to auto-detect per request (http on the
      # direct 10G/LAN path, https when it comes through the reverse proxy) — the image only sets
      # these when non-empty. Set TRUSTED_PROXIES to the NPM address so Nextcloud honours the
      # proxy's X-Forwarded-Proto (needed for https via NPM to work without breaking direct http).
      # Only hard-set OVERWRITEPROTOCOL=https if ALL access goes through the proxy.
      OVERWRITEPROTOCOL: ${NEXTCLOUD_OVERWRITEPROTOCOL:-}
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES:-}
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITECLIURL:-}
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G
    networks: [nextcloud, default]

  # Runs Nextcloud's background jobs (cron) — required for a healthy instance.
  nextcloud-cron:
    image: nextcloud:apache
    container_name: nextcloud-cron
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
      - ./data:/var/www/html/data
    entrypoint: /cron.sh
    depends_on: [nextcloud-db, nextcloud-redis]
    networks: [nextcloud]

  # Ships Nextcloud's JSON log to the hub's Loki for the "Nextcloud Logs" dashboard. Tails
  # ./data/nextcloud.log (read-only) and pushes over the LAN to Loki :3100 on the hub. Config in
  # alloy-nextcloud.config.alloy (synced alongside this file by the role).
  nextcloud-alloy:
    image: grafana/alloy:v1.5.1
    container_name: nextcloud-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      NEXTCLOUD_LOKI_URL: ${NEXTCLOUD_LOKI_URL:-http://192.168.1.7:3100/loki/api/v1/push}
    volumes:
      - ./alloy-nextcloud.config.alloy:/etc/alloy/config.alloy:ro
      - ./data:/nextcloud-logs:ro
      - nextcloud-alloy-data:/var/lib/alloy/data
    networks: [default]

volumes:
  nextcloud-alloy-data:

networks:
  nextcloud:
    driver: bridge
