# Media server stack running ON the NAS (TrueNAS SCALE native Docker) — LAN/VPN only, no public
# exposure. Deployed by ansible/roles/truenas_media (tag `media`), which creates the ZFS datasets,
# syncs this file + a gitignored .env to the `mediaserver` dataset and runs `docker compose up -d`.
# Same pattern as hosts/truenas/nextcloud.compose.yml.
#
# STORAGE — the whole point of the layout below is HARDLINKS + ATOMIC MOVES (TRaSH guide): the
# download client and the *arr libraries MUST share ONE filesystem, so Sonarr/Radarr import by
# hardlinking instead of copying (instant, no double space, seeding continues). That is why every
# app that touches media mounts the SAME dataset as a single `/data` root, NOT per-app subfolders:
#   ${MEDIA_LIBRARY_HOST_PATH}  = /mnt/<pool>/media   -> /data
#     /data/torrents/{complete,incomplete}   (qBittorrent)
#     /data/media/movies                     (Radarr library + Jellyfin)
#     /data/media/tv                         (Sonarr library + Jellyfin)
# Per-app CONFIG lives next to this compose on the `mediaserver` dataset (./config/<app>), relative
# to this file's location ({{ truenas_media_dir }} = /mnt/<pool>/mediaserver) — small, snapshotted.
#
# Ports are published on the host (reachable at 192.168.1.18:<port> over LAN/WireGuard). Internally
# the services talk to each other by container name on the `media` bridge (e.g. Sonarr → the
# download client at gluetun:8080 — qBittorrent shares gluetun's namespace — indexers at
# jackett:9117) — use those names, not host ports.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIA_LIBRARY_HOST_PATH:-/mnt/tank/media}:/data
    # HW transcoding: the Supermicro X10SRL-F (Xeon E5) has NO iGPU / QuickSync, so transcoding is
    # CPU-only — prefer Direct Play from clients. If you ever add an Intel/AMD GPU, uncomment:
    # devices:
    #   - /dev/dri:/dev/dri
    networks: [media]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_LIBRARY_HOST_PATH:-/mnt/tank/media}:/data
    networks: [media]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_LIBRARY_HOST_PATH:-/mnt/tank/media}:/data
    networks: [media]

  # Bazarr — auto-downloads subtitles (e.g. Spanish) for the Sonarr/Radarr library. Mounts the SAME
  # /data so it drops the .srt next to each video (paths must match what Sonarr/Radarr report).
  # Connect it to sonarr:8989 + radarr:7878 and add the wanted languages in its UI.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_LIBRARY_HOST_PATH:-/mnt/tank/media}:/data
    networks: [media]

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${JACKETT_PORT:-9117}:9117"
    volumes:
      - ./config/jackett:/config
    networks: [media]

  # FlareSolverr — headless-browser proxy that solves Cloudflare "challenge" pages for Jackett
  # indexers that are behind Cloudflare (e.g. 1337x). Jackett reaches it internally at
  # http://flaresolverr:8191 (set it in Jackett → Settings → FlareSolverr API URL). No published
  # port (only Jackett uses it). Not routed through the VPN — it only fetches indexer search pages.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Madrid}
    networks: [media]

  # gluetun — VPN gateway (AirVPN over WireGuard). qBittorrent runs INSIDE this container's network
  # namespace (network_mode: service:gluetun below), so ALL torrent traffic goes through the tunnel
  # and gluetun's built-in firewall kill-switch drops everything if the VPN goes down. Because
  # gluetun owns the namespace, qBittorrent's WebUI + BT ports are PUBLISHED HERE, and the *arr apps
  # reach the download client at `gluetun:8080` (NOT qbittorrent:8080).
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: airvpn
      VPN_TYPE: wireguard
      # From AirVPN's Config Generator (WireGuard). AirVPN uses a PRESHARED key too — all three are
      # required. Set them in media.env.
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set WIREGUARD_PRIVATE_KEY in .env}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:?set WIREGUARD_PRESHARED_KEY in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?set WIREGUARD_ADDRESSES in .env}
      # Pick exit servers by country (or pin one with SERVER_NAMES=<AirVPN server name>).
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-Netherlands}
      SERVER_NAMES: ${VPN_SERVER_NAMES:-}
      # FIXED WireGuard MTU. The path blocks ICMP so gluetun's PMTUD fails and it flapped the tunnel
      # in a loop (healthcheck i/o timeouts) → every torrent stalled. Pinning the MTU stops the
      # re-discovery/restart loop and lets bulk BitTorrent traffic through. 1320 is what PMTUD found;
      # drop to 1280 if it still flaps.
      WIREGUARD_MTU: ${VPN_WIREGUARD_MTU:-1320}
      # Give the tunnel more time to come up before the healthcheck restarts it (default 6s is too
      # aggressive on a flaky path), and don't hammer restarts.
      HEALTH_VPN_DURATION_INITIAL: ${VPN_HEALTH_DURATION_INITIAL:-30s}
      TZ: ${TZ:-Europe/Madrid}
      # Let the LAN/VPN subnet reach the published WebUI through gluetun (the kill-switch otherwise
      # blocks non-tunnel traffic). Must include the hub running homepage.
      FIREWALL_OUTBOUND_SUBNETS: ${VPN_LAN_SUBNET:-192.168.1.0/24}
    volumes:
      # gluetun ≥3.40 makes ALL control-server routes private by default. This tiny auth file grants
      # the read-only routes the gluetun-exporter polls (VPN status / public IP / forwarded port) with
      # auth="none" — safe because the control server is only reachable INSIDE the `media` bridge
      # (no published :8000). See hosts/truenas/config/gluetun/auth-config.toml.
      - ./config/gluetun/auth-config.toml:/gluetun/auth/config.toml:ro
    ports:
      # qBittorrent WebUI (8085→8080) + the BT peer port. NOTE for AirVPN: port forwarding is NOT
      # dynamic — reserve a port in the AirVPN client area (Ports) and set QBITTORRENT_BT_PORT to it,
      # then set qBittorrent's incoming-connections port to the same value.
      - "${QBITTORRENT_PORT:-8085}:8080"
      - "${QBITTORRENT_BT_PORT:-6881}:6881"
      - "${QBITTORRENT_BT_PORT:-6881}:6881/udp"
    networks: [media]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # Share gluetun's network stack → all traffic tunnelled, kill-switch enforced. No ports/networks
    # here (they live on gluetun). depends_on service_healthy waits for the VPN to be up first.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:-Europe/Madrid}
      # WebUI port inside the (gluetun) namespace; published on the host as ${QBITTORRENT_PORT}.
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_LIBRARY_HOST_PATH:-/mnt/tank/media}:/data

  # Requests / discovery front-end. Uses SEERR (ghcr.io/seerr-team/seerr = Docker Hub seerr/seerr),
  # the maintained successor of Jellyseerr — the old fallenbagel/jellyseerr image is ARCHIVED and
  # doesn't support current Jellyfin (12.x auth breaks). Seerr keeps the same port 5055 and the same
  # /app/config path, so it reuses this volume and migrates the existing config in place. The service
  # / container / DNS name stays `jellyseerr` to avoid churn across the stack. Runs as node (UID 1000).
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Europe/Madrid}
      LOG_LEVEL: info
      PORT: 5055
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    volumes:
      - ./config/jellyseerr:/app/config
    networks: [media]

  # Cantinarr — media discovery + request management + assistant layered over the *arr stack
  # (ghcr.io/windoze95/cantinarr). Setup wizard at http://<nas>:8585 on first run.
  cantinarr:
    image: ghcr.io/windoze95/cantinarr:latest
    container_name: cantinarr
    restart: unless-stopped
    environment:
      # Push notifications are opt-in; the hosted gateway is the project default. Blank = disabled.
      CANTINARR_PUSH_GATEWAY_URL: ${CANTINARR_PUSH_GATEWAY_URL:-https://push.cantinarr.com}
      PUID: ${PUID:?}
      PGID: ${PGID:?}
    ports:
      - "${CANTINARR_PORT:-8585}:8585"
    volumes:
      - ./config/cantinarr:/config
    networks: [media]

  # ─────────────────────────────────────────────────────────────────────────────────
  # OBSERVABILITY — metrics exporters + a log shipper, scraped/collected by the hub.
  # Same pattern as the graphite-exporter in hosts/truenas/docker-compose.yml and the
  # nextcloud-alloy sidecar: everything runs ON the NAS and PUBLISHES its port on
  # 192.168.1.18 so the hub's Prometheus scrapes it over the LAN (jobs sonarr/radarr/
  # bazarr/qbittorrent/gluetun/jellyfin in core/prometheus/prometheus.yml). See the
  # "Observability" section of hosts/truenas/README.md. LAN-only, no public exposure.
  # ─────────────────────────────────────────────────────────────────────────────────

  # exportarr — one instance per *arr app (Prometheus metrics from each app's REST API).
  # Current exportarr no longer reads config.xml, so the API key MUST be passed as API_KEY.
  # SONARR_KEY/RADARR_KEY/BAZARR_KEY are auto-written into this stack's .env by the
  # truenas_media role after first boot (from each app's config) — do NOT set them by hand.
  sonarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: sonarr-exporter
    restart: unless-stopped
    command: ["sonarr"]
    environment:
      PORT: 9707
      URL: "http://sonarr:8989"
      # Blank until the role discovers it on first boot — the exporter just restarts until then;
      # NOT `:?` on purpose, or an empty key would abort `docker compose up` for the WHOLE stack.
      API_KEY: ${SONARR_KEY:-}
    ports:
      - "9707:9707"
    depends_on: [sonarr]
    networks: [media]

  radarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: radarr-exporter
    restart: unless-stopped
    command: ["radarr"]
    environment:
      PORT: 9707
      URL: "http://radarr:7878"
      API_KEY: ${RADARR_KEY:-}
    ports:
      - "9708:9707"
    depends_on: [radarr]
    networks: [media]

  bazarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: bazarr-exporter
    restart: unless-stopped
    command: ["bazarr"]
    environment:
      PORT: 9707
      URL: "http://bazarr:6767"
      API_KEY: ${BAZARR_KEY:-}
    ports:
      - "9709:9707"
    depends_on: [bazarr]
    networks: [media]

  # qBittorrent metrics. qBittorrent runs in gluetun's namespace, so its WebUI is reached at
  # gluetun:8080 (NOT qbittorrent:8080). No credentials are needed: the truenas_media role
  # whitelists the Docker bridge range in qBittorrent (WebUI\AuthSubnetWhitelist), so this
  # exporter — on the `media` bridge — bypasses auth the same way the homepage widget does.
  qbittorrent-exporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:latest
    container_name: qbittorrent-exporter
    restart: unless-stopped
    environment:
      QBITTORRENT_HOST: gluetun
      QBITTORRENT_PORT: 8080
      EXPORTER_PORT: 8000
      # No auth needed thanks to the subnet whitelist; kept blank on purpose.
      QBITTORRENT_USER: ${QBITTORRENT_USER:-}
      QBITTORRENT_PASS: ${QBITTORRENT_PASSWORD:-}
    ports:
      - "9710:8000"
    depends_on: [gluetun]
    networks: [media]

  # gluetun / VPN health — polls gluetun's control server (:8000, internal to the bridge) and
  # exposes VPN status, the public (AirVPN exit) IP and the forwarded port. The `standalone`
  # variant only needs HTTP access to the control server; auth is granted by auth-config.toml.
  gluetun-exporter:
    image: ghcr.io/thecfu/gluetun-exporter:0-standalone
    container_name: gluetun-exporter
    restart: unless-stopped
    environment:
      GLUETUN_URL: "http://gluetun:8000"
      EXPORTER_PORT: 8001
    ports:
      - "9711:8001"
    depends_on: [gluetun]
    networks: [media]

  # Log shipper — tails the stdout/stderr of every container in THIS compose project via the
  # Docker socket and pushes it to the hub's Loki (job="media", instance="truenas"). Same idea as
  # nextcloud-alloy but socket-based so one sidecar covers the whole stack. Config in
  # alloy-media.config.alloy (synced alongside this file by the role).
  media-alloy:
    image: grafana/alloy:v1.5.1
    container_name: media-alloy
    restart: unless-stopped
    # Root so it can read the Docker socket (root:docker) to tail every container's logs.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MEDIA_LOKI_URL: ${MEDIA_LOKI_URL:-http://192.168.1.7:3100/loki/api/v1/push}
    volumes:
      - ./alloy-media.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - media-alloy-data:/var/lib/alloy/data
    networks: [media]

volumes:
  media-alloy-data:

networks:
  media:
    driver: bridge
