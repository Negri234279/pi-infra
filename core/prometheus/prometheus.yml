# INFRA Prometheus — host + container metrics for the Raspberry Pi 5.
#
# Scope is deliberately narrow: the Pi itself (node-exporter) and every
# container (cadvisor). Per-app business metrics live in each app's OWN
# Prometheus, which this stack's Grafana queries as a separate datasource over
# the shared `monitoring` network. Keep app scrape jobs OUT of this file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: rpi5
    role: infra

rule_files:
  - /etc/prometheus/rules/*.yml

# Dynamic scrape jobs written by prometheus-init (kept out of git). Currently the
# healthchecks.io endpoint, whose URL embeds a secret key — see core/docker-compose.yml.
scrape_config_files:
  - /etc/prometheus-dynamic/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Self-health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Host: CPU, RAM, swap, disk, network, RPi5 temperature (hwmon). The `host`
  # label lets the Pi overview dashboard switch between rpi5 and rpi3.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: rpi5

  # Second host: the rpi3 (192.168.1.6), scraped over the LAN. It runs only
  # node-exporter, deployed from this repo's hosts/rpi3/ stack. Kept a SEPARATE
  # job (not extra targets under `node`) so the single-host pi-overview dashboard
  # and the rpi5 host alerts stay unaffected; rpi3 has its own alert group.
  - job_name: node-rpi3
    static_configs:
      - targets: ["192.168.1.6:9100"]
        labels:
          host: rpi3

  # Third host: the Proxmox VE server (mgmt 192.168.1.14), scraped over the LAN. It
  # runs node-exporter, installed natively (systemd) by the Ansible bootstrap
  # (ansible/) — no Docker on the hypervisor. Kept a SEPARATE job (like node-rpi3) so
  # the single-host pi-overview dashboard and the
  # rpi5 host alerts stay unaffected; pve has its own alert group (host-pve). The
  # box's VMs/LXC/storage come from the `pve` job below, not from here.
  - job_name: node-pve
    static_configs:
      - targets: ["192.168.1.14:9100"]
        labels:
          host: pve

  # Proxmox VE cluster/guest/storage metrics via pve-exporter (PVE REST API). The
  # exporter runs in an LXC ON the pve node (ansible/roles/pve_exporter_lxc), so we
  # scrape it over the LAN instead of by container name. Same target-rewrite as the
  # SNMP jobs: __address__ is the PVE API host (passed as ?target=), then rewritten to
  # the exporter's LXC address; `module` picks the credentials block in the LXC's
  # /etc/prometheus/pve.yml. The exporter polls the API each scrape, so 30s is plenty.
  # NOTE: the replacement IP below MUST match pve_exporter_lxc_ip (group_vars/proxmox.yml).
  - job_name: pve
    scrape_interval: 30s
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["192.168.1.14"] # the PVE API host (pve.negri.es), passed as ?target=
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "192.168.1.15:9221" # the pve-exporter LXC on the pve node

  # NAS BMC (Supermicro X10SRL-F) via ipmi_exporter in REMOTE mode. Same multi-target
  # mechanism as the SNMP/blackbox jobs: __address__ is the BMC ip (passed as the
  # ?target= param), then rewritten to the exporter's own address; `module` picks the
  # credential + collector block in core/ipmi-exporter/ipmi.yml. A scrape runs several
  # freeipmi calls (bmc/ipmi/chassis/dcmi/sel), so it's slow — poll at 60s and give it a
  # 30s scrape_timeout (must exceed the module's session-timeout × #collectors).
  - job_name: ipmi
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /ipmi
    params:
      module: [default]
    static_configs:
      # NO extra `name` label here: ipmi_exporter already emits a per-sensor `name`
      # label (FAN1, "System Temp", "12V", …). A target `name` label would COLLIDE and,
      # with honor_labels=false (default), overwrite every sensor's name (pushing the
      # real one to `exported_name`) — so panels/alerts would read "nas-bmc" for all.
      # The BMC is identified by `instance=192.168.1.17` (set by the relabel below).
      - targets: ["192.168.1.17"] # the NAS BMC (nas-remote.negri.es)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "ipmi-exporter:9290"

  # TrueNAS SCALE 25.10 OS/ZFS metrics. TrueNAS's built-in netdata pushes everything it collects
  # (ZFS pools + ARC, per-disk SMART/temps, sensors, CPU/RAM/net, Docker apps) in the Graphite
  # line protocol to a graphite_exporter container ON the NAS (hosts/truenas/, provisioned by
  # ansible/playbooks/bootstrap-truenas.yml). That exporter — image with the TrueNAS mapping
  # baked in — converts them to Prometheus metrics on :9108, which we scrape here over the LAN
  # via the mgmt NIC. All series already carry job="truenas" (set by the mapping); `host` is
  # added for consistency with the other node jobs. The BMC/IPMI side is the separate `ipmi` job
  # above. Metric names: zfs_pool, disk_temperature, cpu_temperature, truenas_arcstats,
  # disk_bytes_used/avail, etc. — see hosts/truenas/README.md.
  - job_name: truenas
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.1.18:9108"]
        labels:
          host: truenas
    metric_relabel_configs:
      # ── Physical chassis map — HSW6424, 24-bay, 4 cols × 6 rows, LSI 9305-24i ───────────────
      # Tags every disk series that carries a `serial` label (disk_temperature) with its physical
      # bay (bay="C{col}R{row}"), vdev group and pool, so the truenas-chassis dashboard can
      # address each tile by bay and colour it by vdev. This is the ONE place the disk↔bay↔vdev
      # mapping lives — the metrics themselves know nothing about physical slots or vdev membership.
      #
      # The block between the ANSIBLE-MANAGED markers is GENERATED by the `truenas_disk_inventory`
      # role (HBA slot via sas3ircu → bay `slot//4=row, slot%4=col`; vdev/pool via zpool). Re-run
      # `./run.sh playbooks/bootstrap-truenas.yml --tags disk_inventory` after any re-cabling or
      # disk swap to refresh it; edit by hand only as a stop-gap. Each drive matches on either its
      # VPD serial (what netdata usually emits) or the HBA short serial, to be robust.
      # BEGIN ANSIBLE MANAGED BLOCK truenas-disk-map
      - { source_labels: [serial], regex: "(X660A085FUZ5|A085FUZ5)", target_label: bay, replacement: "C1R1" }
      - { source_labels: [serial], regex: "(X660A085FUZ5|A085FUZ5)", target_label: pool, replacement: "tank" }
      - { source_labels: [serial], regex: "(X660A085FUZ5|A085FUZ5)", target_label: vdev, replacement: "raidz2-0" }
      - { source_labels: [serial], regex: "(3430A022FUZ5|A022FUZ5)", target_label: bay, replacement: "C2R1" }
      - { source_labels: [serial], regex: "(3430A022FUZ5|A022FUZ5)", target_label: pool, replacement: "tank" }
      - { source_labels: [serial], regex: "(3430A022FUZ5|A022FUZ5)", target_label: vdev, replacement: "raidz2-0" }
      - { source_labels: [serial], regex: "(4590A00AFUZ5|A00AFUZ5)", target_label: bay, replacement: "C1R2" }
      - { source_labels: [serial], regex: "(4590A00AFUZ5|A00AFUZ5)", target_label: pool, replacement: "tank" }
      - { source_labels: [serial], regex: "(4590A00AFUZ5|A00AFUZ5)", target_label: vdev, replacement: "raidz2-0" }
      - { source_labels: [serial], regex: "(35M0A0XAFUZ5|A0XAFUZ5)", target_label: bay, replacement: "C2R2" }
      - { source_labels: [serial], regex: "(35M0A0XAFUZ5|A0XAFUZ5)", target_label: pool, replacement: "tank" }
      - { source_labels: [serial], regex: "(35M0A0XAFUZ5|A0XAFUZ5)", target_label: vdev, replacement: "raidz2-0" }
      - { source_labels: [serial], regex: "(24D0A00KFUZ5|A00KFUZ5)", target_label: bay, replacement: "C1R3" }
      - { source_labels: [serial], regex: "(24D0A00KFUZ5|A00KFUZ5)", target_label: pool, replacement: "tank" }
      - { source_labels: [serial], regex: "(24D0A00KFUZ5|A00KFUZ5)", target_label: vdev, replacement: "raidz2-0" }
      - { source_labels: [serial], regex: "(Y5L0A03DFUZ5|A03DFUZ5)", target_label: bay, replacement: "C2R3" }
      - { source_labels: [serial], regex: "(Y5L0A03DFUZ5|A03DFUZ5)", target_label: pool, replacement: "tank" }
      - { source_labels: [serial], regex: "(Y5L0A03DFUZ5|A03DFUZ5)", target_label: vdev, replacement: "raidz2-0" }
      - { source_labels: [serial], regex: "S24ZNX0H928770Z", target_label: bay, replacement: "C4R1" }
      - { source_labels: [serial], regex: "S24ZNX0H928770Z", target_label: pool, replacement: "boot-pool" }
      - { source_labels: [serial], regex: "S24ZNX0H928770Z", target_label: vdev, replacement: "mirror-0" }
      - { source_labels: [serial], regex: "50026B785401B363", target_label: bay, replacement: "C4R2" }
      - { source_labels: [serial], regex: "50026B785401B363", target_label: pool, replacement: "boot-pool" }
      - { source_labels: [serial], regex: "50026B785401B363", target_label: vdev, replacement: "mirror-0" }
      # END ANSIBLE MANAGED BLOCK truenas-disk-map

  # All containers on the Pi (reached by service DNS on the monitoring network).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # NVMe SMART health via smartctl-exporter (see core/docker-compose.yml). Polls
  # the drive itself; internal-only on the monitoring network.
  - job_name: smartctl
    static_configs:
      - targets: ["smartctl-exporter:9633"]

  # nginx-proxy-manager metrics via the nginxlog-exporter. Both NPM and the
  # exporter now run in the CORE stack (see core/docker-compose.yml and
  # core/nginx-proxy-manager/); the exporter tails NPM's combined access log.
  - job_name: nginx-proxy-manager
    static_configs:
      - targets: ["npm-exporter:4040"]

  # Shared Postgres: one exporter, auto-discovering every app's database. Metrics
  # are labelled by `datname`, so per-app dashboards filter on it.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Cloudflare account/zone analytics + R2. The exporter refreshes from CF's API
  # every ~5 min (SCRAPE_DELAY), so a fast scrape adds nothing — poll at 60s.
  - job_name: cloudflare
    scrape_interval: 60s
    static_configs:
      - targets: ["cloudflare-exporter:8080"]

  # WireGuard VPN (wg-easy). Metrics are OPT-IN: enable them once in the admin UI
  # (General → Prometheus) or this target reads as down. No Bearer token is set, so
  # it's scraped straight over the monitoring network at /metrics/prometheus.
  - job_name: wg-easy
    scrape_interval: 30s
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["wg-easy:51821"]

  # MikroTik RB750Gr3 router via mktxp (RouterOS API). mktxp scrapes the router
  # every ~5s internally; a 30s scrape here is plenty. Device credentials live in
  # core/mktxp/mktxp.conf (gitignored).
  - job_name: mikrotik
    scrape_interval: 30s
    static_configs:
      - targets: ["mktxp:49090"]

  # CSS326 switch via snmp-exporter (SwOS SNMP v2c, IF-MIB). Prometheus asks the
  # exporter to poll the switch: __address__ is the SWITCH ip (passed as the
  # target param), then rewritten to the exporter's own address. `module` picks
  # the OID set, `auth` picks the community (see core/snmp-exporter/snmp.yml).
  - job_name: switch-snmp
    scrape_interval: 30s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    static_configs:
      - targets: ["192.168.1.5"] # the CSS326 switch
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "snmp-exporter:9116"

  # Sodola SL-SWTGW3C8F switch (8× 10G SFP+, L3 managed) via snmp-exporter. Same
  # mechanism as the CSS326 above but its OWN job so the Sodola dashboard filters
  # cleanly on job="switch-sodola-snmp". `auth: sodola_v2` selects that switch's
  # SNMP community (core/snmp-exporter/snmp.yml) so the two switches' communities
  # can be managed independently. Enable SNMP in the switch web UI first.
  - job_name: switch-sodola-snmp
    scrape_interval: 30s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [sodola_v2]
    static_configs:
      - targets: ["192.168.1.4"] # the Sodola SL-SWTGW3C8F switch
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "snmp-exporter:9116"

  # Blackbox liveness probes. Prometheus passes the TARGET as ?target=; relabeling
  # rewrites __address__ to the exporter and keeps the target as `instance`. The
  # per-target `name` label makes alerts readable.
  # TCP:22 on the Linux hosts = REAL userspace liveness (unlike ICMP).
  - job_name: blackbox-ssh
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["192.168.1.7:22"]
        labels: { name: rpi5-ssh }
      - targets: ["192.168.1.6:22"]
        labels: { name: rpi3-ssh }
      - targets: ["192.168.1.14:22"]
        labels: { name: pve-ssh }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # ICMP reachability for the network appliances (no userspace to freeze).
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["192.168.1.2"]
        labels: { name: router }
      - targets: ["192.168.1.5"]
        labels: { name: switch }
      - targets: ["192.168.1.4"]
        labels: { name: sodola }
      # NOTE: the Proxmox 10G Mellanox NIC is NOT probed here — it lives on an
      # ISOLATED point-to-point net (10.10.10.0/24, direct link to the W11 box) that
      # this hub can't route to. Its link health is watched via node-exporter on the
      # pve host instead — see PveTenGLinkDown in core/prometheus/rules/pve-alerts.yml.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # HTTPS health of the Proxmox web panel (192.168.1.14:8006). Its own job because the
  # panel serves a SELF-SIGNED cert, so it needs the http_2xx_insecure module (TLS
  # verify off) — see core/blackbox/blackbox.yml. A 200 here means pveproxy is serving.
  - job_name: blackbox-https-insecure
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    static_configs:
      - targets: ["https://192.168.1.14:8006"]
        labels: { name: pve-web }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # HTTP health of services WITHOUT their own `up` metric (Grafana and Loki aren't
  # scraped by Prometheus), so this adds real coverage. Reached by service DNS on
  # the monitoring network. Full path (scheme included) is the probe target.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://grafana:3000/api/health"]
        labels: { name: grafana }
      - targets: ["http://loki:3100/ready"]
        labels: { name: loki }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
