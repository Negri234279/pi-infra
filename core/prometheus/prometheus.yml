# INFRA Prometheus — host + container metrics for the Raspberry Pi 5.
#
# Scope is deliberately narrow: the Pi itself (node-exporter) and every
# container (cadvisor). Per-app business metrics live in each app's OWN
# Prometheus, which this stack's Grafana queries as a separate datasource over
# the shared `monitoring` network. Keep app scrape jobs OUT of this file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: rpi5
    role: infra

rule_files:
  - /etc/prometheus/rules/*.yml

# Dynamic scrape jobs written by prometheus-init (kept out of git). Currently the
# healthchecks.io endpoint, whose URL embeds a secret key — see core/docker-compose.yml.
scrape_config_files:
  - /etc/prometheus-dynamic/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Self-health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Host: CPU, RAM, swap, disk, network, RPi5 temperature (hwmon).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Second host: the rpi3 (192.168.1.6), scraped over the LAN. It runs only
  # node-exporter, deployed from this repo's hosts/rpi3/ stack. Kept a SEPARATE
  # job (not extra targets under `node`) so the single-host pi-overview dashboard
  # and the rpi5 host alerts stay unaffected; rpi3 has its own alert group.
  - job_name: node-rpi3
    static_configs:
      - targets: ["192.168.1.6:9100"]
        labels:
          host: rpi3

  # All containers on the Pi (reached by service DNS on the monitoring network).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # NVMe SMART health via smartctl-exporter (see core/docker-compose.yml). Polls
  # the drive itself; internal-only on the monitoring network.
  - job_name: smartctl
    static_configs:
      - targets: ["smartctl-exporter:9633"]

  # nginx-proxy-manager metrics via the nginxlog-exporter. Both NPM and the
  # exporter now run in the CORE stack (see core/docker-compose.yml and
  # core/nginx-proxy-manager/); the exporter tails NPM's combined access log.
  - job_name: nginx-proxy-manager
    static_configs:
      - targets: ["npm-exporter:4040"]

  # Shared Postgres: one exporter, auto-discovering every app's database. Metrics
  # are labelled by `datname`, so per-app dashboards filter on it.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Cloudflare account/zone analytics + R2. The exporter refreshes from CF's API
  # every ~5 min (SCRAPE_DELAY), so a fast scrape adds nothing — poll at 60s.
  - job_name: cloudflare
    scrape_interval: 60s
    static_configs:
      - targets: ["cloudflare-exporter:8080"]

  # WireGuard VPN (wg-easy). Metrics are OPT-IN: enable them once in the admin UI
  # (General → Prometheus) or this target reads as down. No Bearer token is set, so
  # it's scraped straight over the monitoring network at /metrics/prometheus.
  - job_name: wg-easy
    scrape_interval: 30s
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["wg-easy:51821"]

  # MikroTik RB750Gr3 router via mktxp (RouterOS API). mktxp scrapes the router
  # every ~5s internally; a 30s scrape here is plenty. Device credentials live in
  # core/mktxp/mktxp.conf (gitignored).
  - job_name: mikrotik
    scrape_interval: 30s
    static_configs:
      - targets: ["mktxp:49090"]

  # CSS326 switch via snmp-exporter (SwOS SNMP v2c, IF-MIB). Prometheus asks the
  # exporter to poll the switch: __address__ is the SWITCH ip (passed as the
  # target param), then rewritten to the exporter's own address. `module` picks
  # the OID set, `auth` picks the community (see core/snmp-exporter/snmp.yml).
  - job_name: switch-snmp
    scrape_interval: 30s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    static_configs:
      - targets: ["192.168.1.5"] # the CSS326 switch
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "snmp-exporter:9116"

  # Blackbox liveness probes. Prometheus passes the TARGET as ?target=; relabeling
  # rewrites __address__ to the exporter and keeps the target as `instance`. The
  # per-target `name` label makes alerts readable.
  # TCP:22 on the Linux hosts = REAL userspace liveness (unlike ICMP).
  - job_name: blackbox-ssh
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["192.168.1.7:22"]
        labels: { name: rpi5-ssh }
      - targets: ["192.168.1.6:22"]
        labels: { name: rpi3-ssh }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # ICMP reachability for the network appliances (no userspace to freeze).
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["192.168.1.2"]
        labels: { name: router }
      - targets: ["192.168.1.5"]
        labels: { name: switch }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # HTTP health of services WITHOUT their own `up` metric (Grafana and Loki aren't
  # scraped by Prometheus), so this adds real coverage. Reached by service DNS on
  # the monitoring network. Full path (scheme included) is the probe target.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://grafana:3000/api/health"]
        labels: { name: grafana }
      - targets: ["http://loki:3100/ready"]
        labels: { name: loki }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
