# Alert rules for the NAS BMC (Supermicro X10SRL-F) via ipmi_exporter (job=ipmi).
# The BMC's OWN thresholds are the source of truth for sensors: the exporter emits a
# per-type state metric — ipmi_temperature_state, ipmi_fan_speed_state,
# ipmi_voltage_state (and ipmi_sensor_state for generic sensors like chassis
# intrusion) — each 0=nominal / 1=warning / 2=critical. We alert on that verdict via a
# __name__ regex over all of them, rather than hard-coding °C/RPM/V limits per sensor.
# Same severity labels → same Discord routing as every other alert. Chassis power-OFF
# is intentionally NOT alerted (a deliberate NAS shutdown is legitimate, like a
# stopped VM).
groups:
  - name: ipmi
    rules:
      - alert: IpmiScrapeDown
        # The exporter couldn't reach/authenticate the BMC at all (or the exporter
        # itself is down). Distinct from an individual collector failing below.
        expr: up{job="ipmi"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NAS IPMI scrape is failing"
          description: "No IPMI metrics from the NAS BMC (192.168.1.17) for >5m — ipmi-exporter down, the BMC is unreachable, or the IPMI credentials are wrong/expired."

      - alert: IpmiExporterAbsent
        # Deadman: the target vanished entirely (job removed/renamed), which up==0
        # can't catch. Mirrors NodeExporterAbsent / PveNodeExporterAbsent.
        expr: absent(up{job="ipmi"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NAS IPMI target series is absent"
          description: "No `up{job=\"ipmi\"}` series at all for >5m — the ipmi-exporter target has gone missing from Prometheus."

      - alert: IpmiCollectorFailing
        # A specific collector keeps failing while the scrape otherwise succeeds.
        # Warning: metrics are partial, not absent. dcmi is EXCLUDED here: the X10SRL-F
        # BMC has no DCMI power sensor, so that collector fails permanently by design
        # (see core/ipmi-exporter/ipmi.yml.example). The exporter's `collectors` list is
        # meant to drop dcmi, but the live ipmi.yml is gitignored/per-host so it may still
        # be running it — excluding it in the expr makes this alert correct regardless.
        expr: ipmi_up{job="ipmi", collector!="dcmi"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NAS IPMI collector {{ $labels.collector }} failing"
          description: "The `{{ $labels.collector }}` collector has been failing for >15m — check the BMC account privilege or feature support. See core/ipmi-exporter/README.md."

      - alert: IpmiSensorCritical
        # Any sensor (temp/fan/voltage/intrusion) the BMC flags CRITICAL against its
        # own thresholds — e.g. a fan stopped, a rail out of spec, or overheating.
        expr: '{__name__=~"ipmi_(temperature|fan_speed|voltage|sensor)_state", job="ipmi"} == 2'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NAS sensor critical: {{ $labels.name }}"
          description: "BMC reports {{ $labels.name }} in CRITICAL state for >2m ({{ $labels.__name__ }}) — check the NAS hardware."

      - alert: IpmiSensorWarning
        expr: '{__name__=~"ipmi_(temperature|fan_speed|voltage|sensor)_state", job="ipmi"} == 1'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS sensor warning: {{ $labels.name }}"
          description: "BMC reports {{ $labels.name }} in WARNING state for >10m ({{ $labels.__name__ }})."

      - alert: IpmiCoolingFault
        # ipmi_chassis_cooling_fault_state is 1=false (no fault) / 0=true (FAULT).
        expr: ipmi_chassis_cooling_fault_state{job="ipmi"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NAS cooling/fan fault"
          description: "The NAS BMC reports a cooling/fan fault for >2m — a fan has likely failed. Check the chassis."

      - alert: IpmiDriveFault
        # ipmi_chassis_drive_fault_state is 1=false (no fault) / 0=true (FAULT).
        expr: ipmi_chassis_drive_fault_state{job="ipmi"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NAS drive fault flag set"
          description: "The NAS BMC reports a drive fault for >5m — check the disks / backplane (cross-check with smartctl on the NAS itself)."

      - alert: IpmiSelNewEntries
        # New rows in the System Event Log = the BMC logged a hardware event (ECC
        # error, thermal/PSU event, intrusion, etc.). A positive delta is worth
        # surfacing even if no sensor is currently out of range. Ignores SEL clears.
        expr: increase(ipmi_sel_logs_count{job="ipmi"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "New entries in the NAS System Event Log"
          description: "The NAS BMC logged {{ printf \"%.0f\" $value }} new SEL event(s) in the last hour — review the IPMI event log at nas-remote.negri.es."
