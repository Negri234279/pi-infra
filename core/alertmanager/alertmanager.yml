# Alertmanager — routes Pi alerts to Discord, and critical ones ALSO to email.
#
# Secrets are NOT here: the `alertmanager-init` container writes them (from .env)
# into files under /etc/alertmanager/secrets/, so no secret lives in git:
#   discord_webhook_url  ← $DISCORD_WEBHOOK_URL
#   heartbeat_url        ← $HEARTBEAT_URL
#   smtp_password        ← $SMTP_PASSWORD   (Gmail app password — see docs/backups.md)
# Native Discord receiver (Alertmanager v0.27+); email via the Gmail smarthost.

global:
  resolve_timeout: 5m
  # SMTP smarthost for the email receiver. Gmail needs an *app password* (2FA on),
  # not the account password; the password itself is read from the secret file.
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "rafalejo01@gmail.com"
  smtp_auth_username: "rafalejo01@gmail.com"
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: discord
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: the always-firing Watchdog alert is relayed to an
    # EXTERNAL heartbeat (healthchecks.io) and never to Discord. A short
    # repeat_interval keeps the ping steady; if it stops (Pi/stack frozen), the
    # external service alarms. `continue: false` (the default) stops it here so
    # it doesn't fall through to Discord.
    - matchers:
        - alertname = "Watchdog"
      receiver: heartbeat
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m

    # Critical alerts: Discord + email, and re-notify more often. Email is here so
    # a phone-visible channel gets them even when the Discord channel goes
    # unwatched (that's how 3 missed backups went unnoticed — see docs/backups.md).
    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      - &discord_cfg
        webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Labels.severity | toUpper }}** · `{{ .Labels.instance }}`
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  # Critical: same Discord message (anchor reuse, so it never drifts) plus email.
  - name: critical
    discord_configs:
      - *discord_cfg
    email_configs:
      - to: "rafalejo01@gmail.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} on {{ .CommonLabels.instance }}'
        html: |-
          {{ range .Alerts }}<p><b>{{ .Labels.severity | toUpper }}</b> · <code>{{ .Labels.instance }}</code><br>
          <b>{{ .Annotations.summary }}</b><br>
          {{ .Annotations.description }}</p>
          {{ end }}

  # External heartbeat for the dead-man's switch. Each Watchdog notification is a
  # POST to a healthchecks.io ping URL; if the pings stop (Pi/stack down), that
  # service alarms you by email/etc. The URL is a secret written by
  # alertmanager-init from $HEARTBEAT_URL (see core/docker-compose.yml + .env).
  # send_resolved is off — a heartbeat has nothing to "resolve".
  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/heartbeat_url
        send_resolved: false

# A critical alert silences the matching warning for the same alert/instance.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "instance"]
