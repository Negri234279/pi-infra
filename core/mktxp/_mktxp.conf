# mktxp system settings (NOT device credentials — those live in mktxp.conf).
# Committed to git: contains no secrets. See akpw/mktxp for every option.
[MKTXP]
    # Exposed to prometheus-infra over the `monitoring` network (job=mikrotik).
    listen = '0.0.0.0:49090'
    socket_timeout = 5
    initial_delay_on_failure = 120
    max_delay_on_failure = 900
    delay_inc_div = 5
    # Per-interface bandwidth test is intrusive (runs btest) — keep it off.
    bandwidth = False
    bandwidth_test_interval = 600
    minimal_collect_interval = 5
    verbose_mode = False
    # One router here, so serial scraping is fine and lighter on the Pi.
    fetch_routers_in_parallel = False
    max_worker_threads = 5
    max_scrape_duration = 30
    total_max_scrape_duration = 90
    compact_default_conf_values = False
