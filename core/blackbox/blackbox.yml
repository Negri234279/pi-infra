# Blackbox exporter modules. Prometheus asks this exporter to probe a target and
# scrapes the result (probe_success, latency, etc). Runs ON the rpi5 and probes
# OUTWARD, so it can't detect the rpi5's own freeze — that's the dead-man's job.
#
# Probe choice matters: for Linux HOSTS we use tcp_connect against SSH (:22),
# because ICMP keeps answering during a userspace/NVMe freeze (the 2026-08-06
# false green). For network APPLIANCES (router, switch) ICMP reachability is fine.
modules:
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [] # defaults to 2xx
      follow_redirects: true
