# Copy to NPM:  /data/nginx/custom/server_proxy.conf
# Included at the end of EVERY proxy-host server {} block, so this single file
# enables the combined log for all hosts — no per-host editing. It's an extra
# access_log: NPM's own per-host logs keep working alongside it.
access_log /data/logs/all_proxy_access.log nginxlog;

# ── Block common vulnerability scanners ─────────────────────────────────────
# Bots probe every host for secrets (.env, .git), WordPress, and backup dumps
# (seen in the nginx exporter: /.env, /.git/config, //xmlrpc.php, wlwmanifest…).
# `return 444` drops the connection with no response, so scanners get nothing.
# None of the proxied apps (Grafana, proxy-control, powerlog, wake-lan…) serve
# these paths, so this is safe across every host. NOTE: ACME (/.well-known/) is
# deliberately NOT matched — Let's Encrypt keeps working.
location ~* /\.(env|git|aws|ssh|svn|hg|htpasswd|htaccess|ds_store) { return 444; }
location ~* (wp-login\.php|wp-admin|wp-includes|wp-content|wp-config|xmlrpc\.php|wlwmanifest\.xml) { return 444; }
location ~* \.(sql|bak|old|swp|zip|tar|gz|tgz|rar|7z)$ { return 444; }
location ~* \.php$ { return 444; }
