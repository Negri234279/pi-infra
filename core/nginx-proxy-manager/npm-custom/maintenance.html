<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Reintenta solo; cuando el upstream vuelva, el 502/503 desaparece y se ve la app. -->
  <meta http-equiv="refresh" content="20">
  <title>En mantenimiento</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1117; color: #e6e8ec;
      padding: 24px; text-align: center;
    }
    .card {
      max-width: 520px; width: 100%;
      background: #171a23; border: 1px solid #262b38; border-radius: 16px;
      padding: 40px 32px; box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .icon { font-size: 56px; line-height: 1; margin-bottom: 8px; }
    h1 { font-size: 1.5rem; margin: 12px 0 8px; }
    p { margin: 0 auto; color: #a9b0be; line-height: 1.6; max-width: 40ch; }
    .hint { margin-top: 20px; font-size: .85rem; color: #6b7280; }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #f5a524; margin-right: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    @media (prefers-color-scheme: light) {
      body { background: #f5f6f8; color: #1a1d24; }
      .card { background: #fff; border-color: #e5e7eb; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
      p { color: #4b5563; } .hint { color: #9aa1ad; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>Estamos en mantenimiento</h1>
    <p>El servicio está temporalmente fuera de servicio mientras aplicamos una actualización. Volverá en breve.</p>
    <p class="hint"><span class="dot"></span>Esta página se recarga automáticamente cada 20&nbsp;segundos.</p>
  </div>
</body>
</html>
