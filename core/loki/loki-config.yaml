# Core single-binary Loki (Pi, filesystem storage) for INFRA logs — currently
# the MikroTik router's remote syslog, shipped in by Alloy. Mirrors powerlog's
# Loki but adds a `ruler` so log-based alerts (errors in the router log) reach
# the SAME core Alertmanager → Discord as the metric alerts.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# LogQL alert rules live in /loki/rules/<tenant>/*.yml. auth is disabled, so the
# single tenant is `fake`. The ruler evaluates them and pushes firing alerts to
# the core Alertmanager, which routes them to Discord exactly like Prometheus.
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  enable_api: true
