# Core single-binary Loki (Pi, filesystem storage) for INFRA logs — currently
# the MikroTik router's remote syslog, shipped in by Alloy. Mirrors powerlog's
# Loki but adds a `ruler` so log-based alerts (errors in the router log) reach
# the SAME core Alertmanager → Discord as the metric alerts.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h
  # Headroom for the one-time backfill when a new log source is enabled: Alloy's
  # loki.source.docker replays each container's on-disk history (bounded to ~7d
  # by reject_old_samples_max_age below), and chatty containers (pgbouncer) burst
  # well past Loki's 4 MB/s default and get 429'd. These lift the per-tenant and
  # per-stream ceilings so the catch-up drains; steady-state volume is tiny.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  # Older-than-7d entries (matching retention) are still rejected 400 and dropped
  # by Alloy — that's intended, not an error to chase.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# LogQL alert rules live in /loki/rules/<tenant>/*.yml. auth is disabled, so the
# single tenant is `fake`. The ruler evaluates them and pushes firing alerts to
# the core Alertmanager, which routes them to Discord exactly like Prometheus.
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  enable_api: true
