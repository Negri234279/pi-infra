# CORE infra stack for the Raspberry Pi 5 (Linux ARM64).
#
# Owns the shared infrastructure of the Pi: the reverse proxy (nginx-proxy-manager)
# plus full observability — the shared Grafana and the INFRA Prometheus that scrapes
# host- and container-level metrics (node-exporter + cadvisor) and NPM's logs.
#
# This file is normally launched via the ROOT compose (../docker-compose.yml), which
# `include:`s it alongside each app under ../apps/. To run only the core:
#
#   Run once:  ../scripts/create-network.sh   (creates the shared `monitoring` network)
#   Up:        docker compose -f core/docker-compose.yml up -d    (from the repo root)
#
# Each app keeps its own Prometheus (under ../apps/<app>/) and joins the external
# `monitoring` network so this Grafana can query it directly as a datasource.
#
# All images are multi-arch and run natively on arm64; the compose is meant to run
# ON the Pi, so the correct arch is pulled automatically.

services:
  grafana:
    image: grafana/grafana:11.6.16
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # Infinity datasource: lets the Cloudflare dashboard query the CF GraphQL
      # Analytics API directly for the per-subdomain breakdown (the exporter below
      # only produces zone-wide totals). Installed on first boot (needs internet).
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      # Passed through so the provisioned Infinity datasource can authenticate to
      # Cloudflare with the same token the exporter uses. Empty → panel just shows
      # no data; nothing else breaks.
      - CF_API_TOKEN=${CF_API_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring

  # Portal único del stack: un dashboard con enlace + estado + widget de cada servicio.
  # El CORE se declara en core/homepage/config/services.yaml; las APPS se AUTO-DESCUBREN
  # por docker labels homepage.* (lee el socket :ro, igual patrón que alloy/cadvisor) y
  # caen en el grupo "Apps" sin tocar config. En `monitoring` para resolver grafana:3000,
  # prometheus:9090, etc. por nombre en los widgets (URL interna, no el subdominio). UI en
  # :3001 (Grafana ya usa 3000); publícalo como home.negri.es por NPM → homepage:3000.
  # Ver core/homepage/README.md (contrato de labels + prerequisitos NPM/DNS + seguridad).
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Sin esto homepage v1 rechaza las peticiones (Host header allowlist).
      - HOMEPAGE_ALLOWED_HOSTS=home.negri.es,192.168.1.7:3001,localhost:3001
      # Credenciales de widgets (referenciadas como {{HOMEPAGE_VAR_*}} en services.yaml).
      # Vacías → el widget no puebla, la tarjeta sigue con href + siteMonitor.
      - HOMEPAGE_VAR_GRAFANA_USER=${GF_ADMIN_USER:-admin}
      - HOMEPAGE_VAR_GRAFANA_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - HOMEPAGE_VAR_NPM_USER=${NPM_ADMIN_EMAIL:-}
      - HOMEPAGE_VAR_NPM_PASSWORD=${NPM_ADMIN_PASSWORD:-}
      - HOMEPAGE_VAR_WG_USER=${WG_ADMIN_USERNAME:-admin}
      - HOMEPAGE_VAR_WG_PASSWORD=${WG_ADMIN_PASSWORD:-}
    volumes:
      - ./homepage/config:/app/config
      # Auto-descubrimiento de apps por labels + estado de contenedores. RO basta.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  # Writes a dynamic scrape file (kept OUT of git) for the healthchecks.io metrics
  # endpoint, whose URL embeds a read-only API key. From $HEALTHCHECKS_* in .env;
  # if unset, writes an empty scrape list (healthchecks scraping disabled).
  prometheus-init:
    image: busybox:1.38.0
    container_name: prometheus-init
    command:
      - "sh"
      - "-c"
      - |
        if [ -n "$$HEALTHCHECKS_PROJECT_UUID" ] && [ -n "$$HEALTHCHECKS_RO_KEY" ]; then
          printf 'scrape_configs:\n  - job_name: healthchecks\n    scheme: https\n    scrape_interval: 60s\n    metrics_path: /projects/%s/metrics/\n    authorization:\n      credentials: %s\n    static_configs:\n      - targets: ["healthchecks.io"]\n' "$$HEALTHCHECKS_PROJECT_UUID" "$$HEALTHCHECKS_RO_KEY" > /dynamic/healthchecks.yml
          echo "wrote healthchecks scrape config"
        else
          printf 'scrape_configs: []\n' > /dynamic/healthchecks.yml
          echo "healthchecks scraping disabled (unset UUID/key)"
        fi
    environment:
      - HEALTHCHECKS_PROJECT_UUID=${HEALTHCHECKS_PROJECT_UUID:-}
      - HEALTHCHECKS_RO_KEY=${HEALTHCHECKS_RO_KEY:-}
    volumes:
      - prometheus-dynamic:/dynamic
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: prometheus-infra
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION_TIME:-15d}"
      - "--storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      # Whole dir so rule files under prometheus/rules/ are mounted too.
      - ./prometheus:/etc/prometheus:ro
      # Dynamic scrape files written by prometheus-init (e.g. healthchecks). Mounted
      # OUTSIDE the read-only ./prometheus bind (can't create a subdir inside it).
      - prometheus-dynamic:/etc/prometheus-dynamic:ro
      - prometheus-data:/prometheus
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring

  # Host metrics: CPU, RAM, swap, disk, network, and RPi5 temperature (hwmon).
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # systemd unit states (running/failed) via the host D-Bus. A failing
      # collector only drops its own metrics — it never crashes node-exporter.
      - "--collector.systemd"
      # Custom host metrics dropped as .prom files (e.g. rpi_throttled from the
      # rpi-throttled.timer). Read from the host mount below (read-only is fine).
      - "--collector.textfile.directory=/host/var/lib/node_exporter/textfile"
    pid: host
    volumes:
      - /:/host:ro,rslave
      # node-exporter's systemd collector dials /var/run/dbus/... inside the
      # container (where /var/run is NOT a symlink to /run), so mount there.
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    networks:
      - monitoring

  # NVMe SMART health (media errors, available spare, wear, unsafe shutdowns,
  # critical-warning flags) — what node-exporter's hwmon temperature can't see.
  # Added after the 2026-08-06 freeze (NVMe power-state dropout) to catch disk
  # degradation early. Least-privilege access: the device + SYS_RAWIO/SYS_ADMIN
  # (not full privileged); runs as root so those caps stay effective.
  smartctl-exporter:
    # No arm64 image upstream (amd64-only since v0.7.0), so build a small image
    # from the official release binary — see core/smartctl-exporter/Dockerfile.
    build:
      context: ./smartctl-exporter
      args:
        SMARTCTL_EXPORTER_VERSION: "0.13.0"
    image: pi-infra/smartctl-exporter:0.13.0
    container_name: smartctl-exporter
    restart: unless-stopped
    user: root
    devices:
      - /dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    command:
      # device-include is a regex matched against the scanned device NAME
      # ("nvme0"), not the /dev path — "/dev/nvme0" never matches and the disk
      # gets ignored (count=0). Match the bare name instead.
      - "--smartctl.device-include=nvme0"
    networks:
      - monitoring

  # Blackbox: liveness probes issued OUTWARD to other hosts/appliances. TCP:22
  # for the Linux hosts (userspace liveness — ICMP false-greens during a freeze),
  # ICMP for the network gear. NET_RAW is needed for the ICMP prober.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    cap_add:
      - NET_RAW
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring

  # Per-container metrics for EVERY container on the Pi. Tuned for ARM/low-power:
  # docker-only, slower housekeeping, and noisy/expensive collectors disabled.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--disable_metrics=disk,tcp,udp,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  watchtower:
    image: nickfedor/watchtower:1.19.0
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
      - WATCHTOWER_LABEL_ENABLE=true # only update opted-in containers
      - WATCHTOWER_CLEANUP=true # prune the replaced images
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true # one container at a time
      - WATCHTOWER_POLL_INTERVAL=300 # check every 5 minutes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring

  # Reverse proxy for the whole Pi. This stack OWNS NPM (it is no longer an external
  # integration). Admin UI on :81, HTTP/HTTPS on :80/:443. Uses NPM's embedded SQLite
  # by default — no separate DB needed. The two npm-custom/*.conf files add a combined
  # access log at /data/logs/all_proxy_access.log that the exporter below tails.
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy-manager/data:/data
      - ./nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      - ./nginx-proxy-manager/npm-custom/http_top.conf:/data/nginx/custom/http_top.conf
      - ./nginx-proxy-manager/npm-custom/server_proxy.conf:/data/nginx/custom/server_proxy.conf
      # Static maintenance page served (as 503) when any proxied app's upstream
      # is down — see the error_page block in server_proxy.conf.
      #- ./nginx-proxy-manager/npm-custom/maintenance.html:/data/nginx/custom/maintenance.html:ro
    networks:
      - monitoring

  # Turns NPM's combined access log into nginx_http_* Prometheus metrics (job
  # `nginx-proxy-manager`, dashboard 25257). Reads the log volume NPM writes.
  npm-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    container_name: npm-exporter
    restart: unless-stopped
    command: [ "-config-file", "/etc/exporter/config.yml" ]
    volumes:
      - ./nginx-proxy-manager/exporter-config.yml:/etc/exporter/config.yml:ro
      - ./nginx-proxy-manager/data/logs:/npm-logs:ro
    depends_on:
      - nginx-proxy-manager
    networks:
      - monitoring

  # Writes the Discord webhook (from .env / DISCORD_WEBHOOK_URL) into a file so
  # Alertmanager can read it via `webhook_url_file` — Alertmanager does NOT
  # expand env vars in its config, so the secret stays out of the YAML and git.
  # ── Remote access (WireGuard VPN) ────────────────────────────────────────
  # wg-easy = a WireGuard server + web admin UI. Lets a GitHub Actions runner or any
  # of your own devices reach the Pi and its LAN over an encrypted tunnel WITHOUT
  # publishing any service to the internet: only ONE UDP port (51820) needs a router
  # port-forward — everything else stays private behind the VPN. Joins `monitoring`
  # so prometheus-infra can scrape it (enable metrics once in the UI: General →
  # Prometheus). Admin UI on :51821.
  #
  # WG_HOST is what clients dial: for LAN-only devices the Pi's IP (192.168.1.7) works;
  # for a GitHub Action over the internet set WG_HOST to your public IP / DDNS host in
  # .env and forward UDP 51820 on the router to 192.168.1.7. INIT_* apply only on the
  # FIRST boot — afterwards manage clients/settings from the admin UI.
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.3.0
    container_name: wg-easy
    restart: unless-stopped
    ports:
      - "51820:51820/udp" # WireGuard tunnel — the ONLY port that needs internet exposure
      - "51821:51821/tcp" # web admin UI + /metrics/prometheus (keep LAN/VPN-only)
    environment:
      # Unattended first-boot setup (skips the web wizard). USERNAME+PASSWORD+HOST+PORT
      # are one group and must all be set together.
      - INIT_ENABLED=true
      - INIT_USERNAME=${WG_ADMIN_USERNAME:-admin}
      - INIT_PASSWORD=${WG_ADMIN_PASSWORD:-changeme_wg}
      - INIT_HOST=${WG_HOST:-192.168.1.7}
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=${WG_DNS:-1.1.1.1}
      # IPv4/IPv6 client subnets (set together). Pinned so INIT_ALLOWED_IPS below can
      # reference the VPN subnet deterministically.
      - INIT_IPV4_CIDR=${WG_IPV4_CIDR:-10.8.0.0/24}
      - INIT_IPV6_CIDR=${WG_IPV6_CIDR:-fdcc:ad94:bacf:61a3::/64}
      # What clients route through the tunnel: the VPN subnet + the Pi's LAN, so a
      # connected runner/device can reach 192.168.1.7 and everything on the home LAN.
      - INIT_ALLOWED_IPS=${WG_ALLOWED_IPS:-10.8.0.0/24,192.168.1.0/24}
      - PORT=51821
      - HOST=0.0.0.0
      # Admin UI over http on the LAN/VPN; front it with NPM+TLS if ever exposed.
      - INSECURE=true
      - DISABLE_IPV6=true
    volumes:
      - wg-easy-data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - monitoring

  alertmanager-init:
    image: busybox:1.38.0
    container_name: alertmanager-init
    command:
      - "sh"
      - "-c"
      - 'printf "%s" "$$DISCORD_WEBHOOK_URL" > /secrets/discord_webhook_url && printf "%s" "$$HEARTBEAT_URL" > /secrets/heartbeat_url && echo "wrote alertmanager secrets"'
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - HEARTBEAT_URL=${HEARTBEAT_URL:-}
    volumes:
      - alertmanager-secrets:/secrets
    restart: "no"

  alertmanager:
    image: prom/alertmanager:v0.33.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    depends_on:
      alertmanager-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  # ── Shared database (one Postgres for every app) ─────────────────────────
  # Apps no longer run their own Postgres: they get a per-app role + database on
  # this instance (provisioned below) and connect through PgBouncer. Lives on the
  # private `db` network; never published to the host.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    networks:
      - db

  # Idempotent provisioner (one-shot on every `up`): ensures the PgBouncer auth
  # backend, the exporter role, and each app's role+db+grants from
  # apps/*/postgres/provision.env. See core/postgres/provision/provision.sh.
  postgres-provisioner:
    image: postgres:16-alpine
    container_name: postgres-provisioner
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      PG_EXPORTER_USER: ${PG_EXPORTER_USER:-postgres_exporter}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:-postgres_exporter}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth}
    entrypoint: [ "sh", "/provision.sh" ]
    volumes:
      - ./postgres/provision/provision.sh:/provision.sh:ro
      # Read every app's provisioning spec (apps/<app>/postgres/provision.env).
      - ../apps:/apps:ro
    networks:
      - db

  # Writes the single PgBouncer auth credential into a secret file (Alertmanager
  # pattern) so it never lives in git. PgBouncer authenticates every other user
  # via auth_query against Postgres, so this is the only entry in userlist.txt.
  pgbouncer-init:
    image: busybox:1.38.0
    container_name: pgbouncer-init
    command:
      - sh
      - -c
      - 'printf "\"pgbouncer_auth\" \"%s\"\n" "$$PGBOUNCER_AUTH_PASSWORD" > /secrets/userlist.txt && echo "wrote pgbouncer userlist"'
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth}
    volumes:
      - pgbouncer-secrets:/secrets
    restart: "no"

  # Connection pooler (transaction mode) in front of the shared Postgres. Apps
  # point their RUNTIME at pgbouncer:6432; migrations bypass it (direct to
  # postgres:5432). New apps need no config here — see core/pgbouncer/pgbouncer.ini.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-provisioner:
        condition: service_completed_successfully
      pgbouncer-init:
        condition: service_completed_successfully
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pgbouncer-secrets:/etc/pgbouncer-secrets:ro
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    networks:
      - db

  # One exporter for the WHOLE cluster: auto-discovers every database and labels
  # series by `datname`, so a single Infra scrape covers all apps. Uses the
  # least-privilege pg_monitor role created by the provisioner.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
    container_name: postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-provisioner:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER:-postgres_exporter}:${PG_EXPORTER_PASSWORD:-postgres_exporter}@postgres:5432/postgres?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }
    networks:
      - db # reach Postgres
      - monitoring # be scraped by the infra Prometheus

  # Cloudflare R2 usage → Prometheus (historical): cloudflare_r2_storage_bytes and
  # cloudflare_r2_operation_count per bucket, for the whole account. Polls the CF
  # GraphQL Analytics API (~5 min). Scraped by prometheus-infra and rendered on the
  # "Cloudflare · negri.es" dashboard. NOTE: zone HTTP analytics are NOT produced
  # here — this exporter only implements the paid per-minute dataset, which a
  # free-plan zone (negri.es) can't access; the dashboard's traffic panels query
  # the free hourly dataset live via the Infinity datasource instead. Token scopes:
  # Zone:Read + Zone Analytics:Read + Account Analytics:Read (see .env / README).
  cloudflare-exporter:
    image: cyb3rjak3/cloudflare-exporter:v2.3.1
    container_name: cloudflare-exporter
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      # Account-scoped tokens need the account id explicitly (also drives R2).
      - CF_ACCOUNTS=${CF_ACCOUNT_ID:-}
      # Optional: restrict to specific zone id(s). Empty = auto-discover every zone
      # the token can read (needs Zone:Read). Set CF_ZONE_ID in .env to pin negri.es.
      - CF_ZONES=${CF_ZONE_ID:-}
      # negri.es is on the free plan by default → only request free-tier datasets.
      # Flip CF_FREE_TIER=false in .env if the zone is on a paid plan.
      - FREE_TIER=${CF_FREE_TIER:-true}
      - LISTEN=:8080
    networks:
      - monitoring

  docker-notifier:
    container_name: docker-notifier
    image: negrii/docker-notifier:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - path: ../.env
    environment:
      # The image expects DISCORD_WEBHOOK; the repo standardizes on DN_DISCORD_WEBHOOK_URL
      - DISCORD_WEBHOOK=${DN_DISCORD_WEBHOOK_URL:-}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ── Network gear observability (MikroTik router + CSS326 switch) ─────────
  # mktxp: MikroTik RB750Gr3 metrics via the RouterOS API. Reads the gitignored
  # core/mktxp/mktxp.conf (device + read-only API password). Scraped by
  # prometheus-infra as job `mikrotik`. See core/network/README.md.
  mktxp:
    image: ghcr.io/akpw/mktxp:latest
    container_name: mktxp
    restart: unless-stopped
    # Image default cmd is already `mktxp export` (entrypoint is null), and its
    # default config dir is ~/mktxp = /home/mktxp/mktxp — so just mount the config.
    volumes:
      - ./mktxp:/home/mktxp/mktxp:ro
    networks:
      - monitoring

  # snmp-exporter: polls the CSS326 switch over SNMP v2c (IF-MIB) on Prometheus's
  # behalf (job `switch-snmp`). SwOS has no remote logging, so the switch is
  # metrics-only. Enable SNMP in the SwOS web UI first (System → SNMP).
  snmp-exporter:
    image: prom/snmp-exporter:v0.29.0
    container_name: snmp-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    volumes:
      - ./snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    networks:
      - monitoring

  # Core Loki: infra logs (currently the router's remote syslog). Its ruler
  # evaluates core/loki/rules/ and pushes log-based alerts to the same
  # Alertmanager as the metric alerts. Queried by Grafana as the `Loki` datasource.
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./loki/rules:/loki/rules:ro
      - loki-data:/loki
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring

  # Alloy: receives the router's remote syslog on 514 (udp+tcp) and ships it to
  # Loki. 514 is the ONE new host port — LAN only, so the router can reach the Pi.
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "514:514/udp" # MikroTik remote syslog (BSD/RFC3164)
      - "514:514/tcp"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Host journald (persistent + current-boot runtime) so the Pi's own logs
      # reach Loki. machine-id lets the journal reader identify the host.
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Docker socket: discover containers and tail their logs into Loki.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  alertmanager-secrets:
  prometheus-dynamic:
  postgres-data:
  pgbouncer-secrets:
  wg-easy-data:
  loki-data:
  alloy-data:

    # Shared, cross-app network. Declared external so each app's compose (under ../apps/,
    # or in its own repo) can join the SAME network (`networks: [monitoring]` +
    # `external: true`) and expose its own Prometheus to this Grafana. Create it once with
    # scripts/create-network.sh.
networks:
  monitoring:
    external: true
    name: monitoring
  # Shared DB network: the Postgres/PgBouncer above ↔ each app. External so apps
  # in their own composes can join it. Create it with scripts/create-network.sh.
  db:
    external: true
    name: db
