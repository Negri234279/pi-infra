- Media (NAS):
    # El stack multimedia corre en el NAS (192.168.1.18), NO en el hub: cross-host y
    # solo-LAN/VPN (sin subdominio NPM), así que se declara a mano aquí (no auto-registro
    # por labels) con href/siteMonitor a la IP LAN + puerto. Los widgets nativos leen su
    # API key/credenciales desde {{HOMEPAGE_VAR_*}} (vacío → tarjeta sin datos pero con
    # enlace + estado). Definido en hosts/truenas/ (rol truenas_media). Jackett y Cantinarr
    # no tienen widget nativo → solo tarjeta.
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.negri.es
        description: Servidor multimedia
        siteMonitor: http://192.168.1.18:8096
        widget:
          type: jellyfin
          url: http://192.168.1.18:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
