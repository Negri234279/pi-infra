# homepage — servicios del CORE. See https://gethomepage.dev/configs/services/
#
# SOLO servicios del core van aquí. Las APPS (apps/<app>/) NO se listan en este
# fichero: se auto-registran con docker labels homepage.* en su propio compose.yml
# (ver core/homepage/README.md). homepage las agrupa bajo "Apps" automáticamente.
#
# Regla de URLs:
#   href        -> subdominio PÚBLICO por NPM (https://<svc>.negri.es)
#   siteMonitor -> URL INTERNA del contenedor (red monitoring), NO el subdominio,
#   widget.url  /  para no pasar por TLS/proxy ni bucles de auth.
#
# Los widgets con credenciales leen {{HOMEPAGE_VAR_*}} (inyectadas por el compose
# desde .env). Si la variable está vacía el widget no puebla, pero la tarjeta sigue
# funcionando con href + siteMonitor.

- Observabilidad:
    - Grafana:
        icon: grafana.png
        href: https://grafana.negri.es
        description: Dashboards & alertas
        siteMonitor: http://grafana:3000/api/health
        widget:
          type: grafana
          version: 2 # Grafana >= 10.4
          url: http://grafana:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"

    - Prometheus:
        icon: prometheus.png
        href: https://prom.negri.es
        description: Métricas infra (targets)
        siteMonitor: http://prometheus:9090/-/healthy
        widget:
          type: prometheus
          url: http://prometheus:9090

    - Alertmanager:
        icon: alertmanager.png
        href: https://alertmanager.negri.es
        description: Alertas activas
        siteMonitor: http://alertmanager:9093/-/healthy
        widget:
          type: customapi
          url: http://alertmanager:9093/api/v2/alerts
          mappings:
            - label: Activas
              format: size # longitud del array de alertas

    - Loki:
        icon: loki.png
        href: https://grafana.negri.es/explore
        description: Logs (vía Grafana)
        siteMonitor: http://loki:3100/ready

    # Corre en el rpi3 (192.168.1.6), NO en el hub rpi5: cross-host, así que se
    # declara a mano aquí (no auto-registro por labels) y el siteMonitor usa la IP
    # LAN del rpi3, no una URL interna de contenedor. Definido en hosts/rpi3/.
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime.negri.es
        description: Monitor de disponibilidad (rpi3)
        siteMonitor: http://192.168.1.6:3001
        # Widget nativo: lee la status page pública "rpis" de Kuma (grupo con los
        # monitores TCP de las 2 RPis). url pública porque la status page se sirve por
        # NPM; debe estar SIN contraseña para que el widget la lea.
        widget:
          type: uptimekuma
          url: https://uptime.negri.es
          slug: rpis
          fields: ["up", "down", "uptime", "incident"]

- Red & Proxy:
    - NGINX Proxy Manager:
        icon: nginx-proxy-manager.png
        href: https://npm.negri.es
        description: Reverse proxy + TLS
        siteMonitor: http://nginx-proxy-manager:81
        widget:
          type: npm
          url: http://nginx-proxy-manager:81
          username: "{{HOMEPAGE_VAR_NPM_USER}}"
          password: "{{HOMEPAGE_VAR_NPM_PASSWORD}}"

    - wg-easy:
        icon: wireguard.png
        href: https://wg.negri.es
        description: VPN WireGuard
        siteMonitor: http://wg-easy:51821
        widget:
          type: wgeasy
          version: 2 # wg-easy >= v15
          url: http://wg-easy:51821
          username: "{{HOMEPAGE_VAR_WG_USER}}"
          password: "{{HOMEPAGE_VAR_WG_PASSWORD}}"

    - MikroTik:
        icon: mikrotik.png
        href: http://192.168.1.2
        description: Router RB750Gr3
        ping: 192.168.1.2
    
    - MikroTik SW:
        icon: mikrotik.png
        href: http://192.168.1.5
        description: Switch CSS326-24G-2S+RM
        ping: 192.168.1.5

    # Switch gestionado: web UI por HTTPS a través de NPM (dominio privado). El
    # ping va a la IP LAN del switch para el indicador de estado, como los otros.
    - Sodola 10G:
        icon: mdi-lan
        href: https://switch-sodola-10gb.negri.es
        description: Switch Sodola SL-SWTGW3C8F · 8×10G SFP+
        ping: 192.168.1.4

- Cómputo:
    # Servidor Proxmox VE (10900KF). El panel web se publica por NPM en
    # pve-web.negri.es (→ 192.168.1.14:8006). El widget nativo `proxmox` lee la API
    # con su PROPIO token de solo lectura (homepage@pve!homepage, distinto del que usa
    # pve-exporter para no acoplar rotaciones): username = user@realm!tokenname,
    # password = el secreto del token (PVE_TOKEN_ID / PVE_TOKEN_SECRET en .env). Vacío
    # → el widget no puebla; la tarjeta sigue con enlace + ping. La observabilidad
    # completa (host, VMs, LXC, almacenamiento) está en Grafana (carpeta Proxmox).
    - Proxmox VE:
        icon: proxmox.png
        href: https://pve-web.negri.es
        description: Servidor virtualización · i9-10900KF
        ping: 192.168.1.14
        widget:
          type: proxmox
          url: https://192.168.1.14:8006
          username: "{{HOMEPAGE_VAR_PVE_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN_SECRET}}"

    # IPMI (BMC) de la Supermicro X10SRL-F del NAS. La web de gestión se publica por
    # NPM en nas-remote.negri.es (→ https://192.168.1.17:443). El ping va a la IP LAN
    # del BMC para el indicador de estado; sin widget nativo para IPMI.
    - NAS IPMI:
        icon: supermicro.png
        href: https://192.168.1.17
        description: IPMI/BMC · NAS (Supermicro X10SRL-F)
        ping: 192.168.1.17

    - NAS Web:
        icon: truenas.png
        href: https://nas-web.negri.es/ui/dashboard
        description: Web management · NAS (Supermicro X10SRL-F)
        ping: 192.168.1.18
        widget:
          type: truenas
          url: https://nas-web.negri.es
          version: 2
          enablePools: true
          key: "{{HOMEPAGE_VAR_NAS_KEY}}"

- Datos:
    - Postgres:
        icon: postgres.png
        description: Base de datos compartida
        server: my-docker
        container: postgres

    - PgBouncer:
        icon: postgres.png
        description: Connection pooler
        server: my-docker
        container: pgbouncer

    - Postgres exporter:
        icon: prometheus.png
        description: Métricas de la BD
        server: my-docker
        container: postgres-exporter
