---
# On-demand recovery after a HOT-SWAP: when a drive is pulled and re-inserted, Linux gives it a
# new device node and TrueNAS's disk catalog (disk.query / disk.temperatures) does not refresh on
# its own, so the metrics pusher loses that disk's SMART temperature (blank/AUSENTE tile, and the
# *DiskMissing alert stays firing) even though ZFS re-admitted it and the pool is ONLINE again.
#
# This re-scans the SCSI buses, re-syncs the middleware disk table, then re-primes the pusher so
# the temperature reappears within seconds instead of waiting on a reboot. Runs with become
# (needs root). Gated behind the `never` tag: a normal bootstrap SKIPS it; run it explicitly:
#   ./run.sh playbooks/bootstrap-truenas.yml --tags rescan

- name: Rescan the SCSI buses so the kernel re-detects hot-swapped drives
  ansible.builtin.shell: |
    set -e
    for h in /sys/class/scsi_host/host*/scan; do echo "- - -" > "$h"; done
  args:
    executable: /bin/bash
  changed_when: true

- name: Re-sync the TrueNAS disk catalog with the actual hardware
  # disk.sync_all rebuilds the middleware disk table (name↔serial↔pool), which disk.temperatures
  # and the pusher rely on. This is the supported way to re-catalog after a swap.
  ansible.builtin.command:
    argv: [midclt, call, disk.sync_all]
  changed_when: true

- name: Re-prime the metrics pusher so disk temps repopulate immediately
  # Script + ports come from group_vars/nas.yml (in scope for the whole play). Without this we'd
  # wait up to a minute for the cron tick.
  ansible.builtin.command:
    argv:
      - python3
      - "{{ truenas_apps_dir }}/truenas-metrics-pusher.py"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "{{ truenas_graphite_ingest_port | string }}"
      - "--base"
      - "{{ truenas_reporting_prefix }}.{{ truenas_reporting_namespace }}"
  register: truenas_rescan_prime
  changed_when: false

# ── Verify the swapped disk is back in the catalog, and wait (best-effort) for SMART ────────────
# The rescan + disk.sync_all above is what actually recovers the disk: disk.temperatures now lists
# it again. A freshly re-inserted drive often reports a `null` temperature for a few minutes until
# TrueNAS's next SMART poll — that's transient and the cron pusher will fill it in on its own, so
# this check is BEST-EFFORT (never fails the play). It retries briefly to give SMART a chance.
- name: Wait (best-effort) for all disks to report a SMART temperature
  ansible.builtin.command:
    argv: [midclt, call, disk.temperatures, "[]"]
  register: truenas_rescan_temps
  changed_when: false
  failed_when: false
  until: >-
    (truenas_rescan_temps.stdout | default('{}') | from_json).values()
    | reject('none') | list | length
    == (truenas_rescan_temps.stdout | default('{}') | from_json) | length
  retries: 6
  delay: 10

- name: Report recovery status
  vars:
    _temps: "{{ truenas_rescan_temps.stdout | default('{}') | from_json }}"
    _null_disks: "{{ _temps | dict2items | selectattr('value', 'none') | map(attribute='key') | list }}"
  ansible.builtin.debug:
    msg: >-
      {{ _temps | length }} disks catalogued.
      {% if _null_disks | length == 0 %}
      All report a SMART temperature — recovery complete.
      {% else %}
      Still awaiting SMART temp for {{ _null_disks | join(', ') }} — this is normal right after a
      re-insert; TrueNAS fills it on its next SMART poll (a few minutes) and the cron pusher then
      restores the chassis tile automatically. Re-run `--tags rescan` later if it persists.
      {% endif %}
