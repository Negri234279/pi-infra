---
# Provision Nextcloud on TrueNAS's native Docker. Runs with become (docker + midclt need root).
# Self-contained: own Postgres + Redis (see hosts/truenas/nextcloud.compose.yml). LAN/VPN only.

# ── Preflight ───────────────────────────────────────────────────────────────────
- name: Check the TrueNAS Docker (Apps) engine status
  ansible.builtin.command:
    argv: [midclt, call, docker.status]
  register: truenas_nc_docker_status
  changed_when: false

- name: Fail if the Docker engine is not running
  ansible.builtin.fail:
    msg: >-
      TrueNAS Docker engine is '{{ (truenas_nc_docker_status.stdout | from_json).status
      | default("UNKNOWN") }}', expected 'RUNNING'. Initialise Apps with a pool first.
  when: (truenas_nc_docker_status.stdout | from_json).status | default('') != 'RUNNING'

- name: Ensure the Nextcloud secrets file exists on the control node
  ansible.builtin.stat:
    path: "{{ truenas_nextcloud_env_src }}"
  register: truenas_nc_env
  delegate_to: localhost
  become: false

- name: Fail if the secrets file is missing
  ansible.builtin.fail:
    msg: >-
      {{ truenas_nextcloud_env_src }} not found. Copy hosts/truenas/nextcloud.env.example to
      hosts/truenas/nextcloud.env and fill in the passwords, then re-run.
  when: not truenas_nc_env.stat.exists

# ── ZFS datasets (idempotent) ─────────────────────────────────────────────────────
- name: Check whether the Nextcloud datasets exist
  ansible.builtin.command:
    argv: [midclt, call, pool.dataset.get_instance, "{{ item }}"]
  loop:
    - "{{ truenas_nextcloud_dataset }}"
    - "{{ truenas_nextcloud_db_dataset }}"
  register: truenas_nc_ds
  changed_when: false
  failed_when: false

- name: Create the missing Nextcloud datasets
  ansible.builtin.command:
    argv: [midclt, call, pool.dataset.create, "{{ {'name': item.item} | to_json }}"]
  loop: "{{ truenas_nc_ds.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true

# ── Sync the compose project + secrets ────────────────────────────────────────────
- name: Sync the Nextcloud compose file
  ansible.builtin.copy:
    src: "{{ truenas_nextcloud_compose_src }}"
    dest: "{{ truenas_nextcloud_dir }}/docker-compose.yml"
    mode: "0644"
  register: truenas_nc_compose

- name: Sync the Nextcloud secrets (.env, next to the compose)
  ansible.builtin.copy:
    src: "{{ truenas_nextcloud_env_src }}"
    dest: "{{ truenas_nextcloud_dir }}/.env"
    mode: "0600"
  register: truenas_nc_envfile

- name: Sync the Alloy log-shipper config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../hosts/truenas/alloy-nextcloud.config.alloy"
    dest: "{{ truenas_nextcloud_dir }}/alloy-nextcloud.config.alloy"
    mode: "0644"
  register: truenas_nc_alloy

- name: Pull the Nextcloud images
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ truenas_nextcloud_dir }}/docker-compose.yml", pull]
  when: truenas_nextcloud_pull | bool
  changed_when: true

- name: Bring up the Nextcloud stack
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ truenas_nextcloud_dir }}/docker-compose.yml", up, -d]
  register: truenas_nc_up
  changed_when: >-
    ('Started' in truenas_nc_up.stderr) or ('Created' in truenas_nc_up.stderr) or
    ('Recreated' in truenas_nc_up.stderr) or ('Pulling' in truenas_nc_up.stderr)

# ── Enable audit logging so the "Nextcloud Logs" dashboard has events ───────────
# occ only works once first-run install has finished; wait for it. Runs as www-data.
- name: Wait for Nextcloud to finish installing
  # Match on the text, NOT from_json: during first boot occ can print warnings before the JSON, so
  # `occ status --output=json` output isn't always clean JSON. `is search` tolerates that.
  ansible.builtin.command:
    argv: [docker, exec, --user, www-data, nextcloud, php, occ, status, --output=json]
  register: truenas_nc_status
  changed_when: false
  failed_when: false
  until: truenas_nc_status.stdout is search('"installed"\s*:\s*true')
  retries: 30
  delay: 10

- name: Enable the admin_audit app (login/file/share events → nextcloud.log)
  ansible.builtin.command:
    argv: [docker, exec, --user, www-data, nextcloud, php, occ, app:enable, admin_audit]
  register: truenas_nc_audit
  changed_when: "'already enabled' not in truenas_nc_audit.stdout"
  when: truenas_nc_status.stdout is search('"installed"\s*:\s*true')

- name: Enable the files_external app (for the External storage / Local mount)
  ansible.builtin.command:
    argv: [docker, exec, --user, www-data, nextcloud, php, occ, app:enable, files_external]
  register: truenas_nc_extapp
  changed_when: "'already enabled' not in truenas_nc_extapp.stdout"
  when: truenas_nc_status.stdout is search('"installed"\s*:\s*true')

- name: Set loglevel to info so audit events are recorded
  # admin_audit logs at INFO (1); the Nextcloud default loglevel 2 (warning) would suppress them.
  ansible.builtin.command:
    argv: [docker, exec, --user, www-data, nextcloud, php, occ, config:system:set, loglevel, "--value=1", "--type=integer"]
  register: truenas_nc_loglevel
  changed_when: "'set to' in truenas_nc_loglevel.stdout"
  when: truenas_nc_status.stdout is search('"installed"\s*:\s*true')

- name: Where to reach it
  ansible.builtin.debug:
    msg: >-
      Nextcloud up. Reach it on the LAN/VPN at http://{{ ansible_host }}:<NEXTCLOUD_PORT> (default
      8080) — admin from nextcloud.env. Logs ship to Loki (job="nextcloud") → Grafana "Nextcloud
      Logs" dashboard. If install hadn't finished, re-run `--tags nextcloud` to enable admin_audit.
