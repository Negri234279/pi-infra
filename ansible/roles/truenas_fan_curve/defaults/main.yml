---
# Force the Supermicro BMC into manual (Full) fan control at a fixed duty on every boot, and
# lower the fans' lower-thresholds so that duty does NOT trip the BMC's 100% failsafe. Delivered
# as a native TrueNAS Init/Shutdown Script (POSTINIT), which persists in the config DB and
# survives reboots + OS updates (unlike anything written to the immutable root fs).
#
# Root cause this fixes: in Full mode the X10 BMC forces ALL zones to 100% if any fan drops below
# its lower-critical / lower-non-recoverable threshold. At 45% duty the fans spin ~900 rpm, below
# the factory threshold → failsafe → back to 100% (the classic "dips then 100% again"). Relaxing
# the lower thresholds lets the low duty hold. See [[nas-truenas-os-integration]].
#
#   ./run.sh playbooks/bootstrap-truenas.yml --tags fan

# ── ZFS dataset for host scripts (shows in Storage → Datasets, snapshot/quota-able) ─
truenas_fan_scripts_dataset: "{{ truenas_pool }}/scripts"
truenas_fan_scripts_dir: "/mnt/{{ truenas_fan_scripts_dataset }}"
truenas_fan_script_dest: "{{ truenas_fan_scripts_dir }}/fan-curve.sh"

# ── Fan curve ───────────────────────────────────────────────────────────────────────
# Per-fan requested duty (%). HARDWARE NOTE: the X10 BMC only controls duty per ZONE, not
# per fan (see truenas_fan_zones below), so fans sharing a zone all spin at the *fastest*
# duty requested among them — the script takes the max per zone. Set a fan lower than its
# zone-mates freely; it will simply be raised to match the fastest fan in its zone.
# First pass: everything at 45%; bump individual fans later as needed (e.g. FAN2: 60).
truenas_fan_duties:
  FAN1: 45
  FAN2: 45
  FAN3: 45
  FAN4: 45
  FAN5: 45
  FANA: 45
  FANB: 45

# Fan → zone map for the raw duty command (arg byte 0x00 = zone 0, 0x01 = zone 1). On the
# X10 the numbered headers are the CPU/chassis zone and the lettered headers the peripheral
# zone. A fan not listed here is threshold-relaxed but gets no duty command.
truenas_fan_zones:
  0: [FAN1, FAN2, FAN3, FAN4, FAN5]   # CPU / chassis
  1: [FANA, FANB]                     # peripheral

# Fans that SHOULD report an rpm reading. If any of these reads "No Reading"/"Disabled" the
# BMC may not have re-enumerated a hot-reconnected fan, so the script does ONE `mc reset cold`
# to force a fresh SDR scan, then reapplies everything.
#
# Only FAN1 is listed: a manual `mc reset cold` was verified NOT to bring FAN2/3/4 back (they
# spin but report no tach), so cold-resetting for them every boot would be pure cost with no
# recovery. PWM control is independent of the tach reading, so FAN2/3/4 still run at their zone
# duty — we just can't monitor their rpm. Re-add a fan here only if a full AC power-cycle (drain
# standby) makes it read again, i.e. once a reset can actually recover it.
truenas_fan_expected: [FAN1]

# Minimum seconds between cold resets (a marker file guards it). Stops back-to-back manual
# runs — or a genuinely dead "expected" fan — from cold-resetting the BMC in a tight loop.
truenas_fan_reset_cooldown: 300

# Lower thresholds (rpm) written to every fan: Lower-NonRecoverable / Lower-Critical /
# Lower-NonCritical (must be ascending). Low enough that the chosen duty stays above them.
# Trade-off: the BMC won't warn on a genuinely failing fan below these — watch rpm in Grafana
# (job `ipmi`) instead if you want that alert back.
truenas_fan_low_lnr: 100
truenas_fan_low_lcr: 200
truenas_fan_low_lnc: 300

# Fan sensor names to relax. Non-existent ones fail harmlessly (FAN1–FAN4 are the populated
# headers on this chassis today, but keep the full X10 set so the script is portable).
truenas_fan_names: [FAN1, FAN2, FAN3, FAN4, FANA, FANB, FAN5]

# ── Init/Shutdown Script registration (native midclt object) ─────────────────────────
truenas_fan_init_when: POSTINIT          # PREINIT | POSTINIT | SHUTDOWN
truenas_fan_init_enabled: true
truenas_fan_init_timeout: 180            # seconds; must exceed IPMI-ready wait + a possible cold reset
# The comment is the idempotency key we query on — keep it stable.
truenas_fan_init_comment: "pi-infra: Supermicro fan curve (Full mode + fixed duty, relaxed thresholds)"
