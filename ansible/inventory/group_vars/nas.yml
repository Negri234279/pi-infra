# Variables for the `nas` inventory group (TrueNAS SCALE 25.10 "Goldeye" @ 192.168.1.18).
#
# Monitoring path (see hosts/truenas/README.md): TrueNAS's built-in netdata pushes its metrics
# in the Graphite line protocol to a graphite_exporter container running ON the NAS. That
# container converts them to Prometheus metrics (via a TrueNAS-specific mapping baked into
# the image) and the hub's Prometheus scrapes it over the LAN at 192.168.1.18:9108.
#
# Two roles consume these (playbooks/bootstrap-truenas.yml):
#   truenas_reporting_exporter — creates the netdata→Graphite exporter via midclt.
#   truenas_docker_stack        — runs hosts/truenas/docker-compose.yml on TrueNAS's native Docker.
---
# ── graphite_exporter container ports ────────────────────────────────────────
# 9109 = Graphite line-protocol ingest (netdata on the host pushes here, locally).
# 9108 = Prometheus /metrics (the hub scrapes this — MUST match the `truenas` job
#        target in core/prometheus/prometheus.yml).
truenas_graphite_ingest_port: 9109
truenas_graphite_metrics_port: 9108

# ── netdata → Graphite Reporting Exporter (role truenas_reporting_exporter) ───
# netdata runs on the HOST and pushes to the container's published ingest port, so the
# destination is the loopback address on the NAS itself. The `truenas` PREFIX is REQUIRED:
# the mapping baked into the exporter image keys off `truenas.<host>.<chart>.<dim>`.
truenas_reporting_exporter_name: pi-infra-graphite
truenas_reporting_destination_ip: "127.0.0.1"
truenas_reporting_prefix: truenas
truenas_reporting_namespace: truenas
truenas_reporting_update_every: 15          # seconds; keep ≤ the Prometheus scrape interval
truenas_reporting_matching_charts: "*"      # export everything netdata collects

# ── Docker stack on TrueNAS (role truenas_docker_stack) ──────────────────────
# The stack lives on its OWN ZFS dataset on a real data pool, created by the role via midclt —
# so it shows up under Storage → Datasets and can be snapshotted/quota'd (a plain mkdir would not
# appear in the UI). The Apps/Docker subsystem must ALSO be initialised with a pool once in the
# UI (that's what gives TrueNAS its Docker engine); the precheck fails clearly if it isn't.
#
# !!! SET truenas_pool to your real pool name (check: `midclt call pool.query | jq -r '.[].name'`).
# Your imported pool is the 6-wide RAIDZ2; if it's called `tank`, the defaults below are correct.
truenas_pool: tank
truenas_apps_dataset_name: pi-infra-monitoring
truenas_apps_dataset: "{{ truenas_pool }}/{{ truenas_apps_dataset_name }}"   # ZFS dataset name
truenas_apps_dir: "/mnt/{{ truenas_apps_dataset }}"                          # its mountpoint

# ── Backup target (role truenas_backup_target, tag `backup`) ──────────────────
# Makes the NAS the Pi's restic backup destination: dataset {{ truenas_pool }}/backups/rpi5,
# an NFS export locked to the Pi, and a native periodic ZFS snapshot task (immutability
# layer for the restic repo). The Pi side is the `backup` service in core/ — see
# docs/backups.md. Defaults (retention/schedule/hosts) live in the role; override here.
# The Pi's LAN IP that the NFS export is restricted to:
truenas_backup_nfs_hosts: ["192.168.1.7"]

# ── Fan curve (role truenas_fan_curve, tag `fan`) ─────────────────────────────
# Forces the Supermicro BMC into Full mode at a fixed duty on every boot via a native POSTINIT
# Init/Shutdown Script (dataset {{ truenas_pool }}/scripts + fan-curve.sh), relaxing the fans'
# lower-thresholds so the low duty holds instead of tripping the BMC's 100% failsafe. All
# tunables (per-fan duties, zones, thresholds, fan list) live in the role defaults; override
# here if needed, e.g. bump one fan (raises its whole zone to the max requested in that zone):
#   truenas_fan_duties: { FAN1: 45, FAN2: 60, FAN3: 60, FAN4: 45, FAN5: 45, FANA: 45, FANB: 45 }
