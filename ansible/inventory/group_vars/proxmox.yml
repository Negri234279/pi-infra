# Variables for the `proxmox` inventory group (the PVE node).
---
# Do NOT let a routine playbook run silently `apt dist-upgrade` the hypervisor.
# A dist-upgrade can pull a new kernel and, if interrupted, leave the box unable
# to boot (initramfs half-built → kernel panic). Kernel/PVE upgrades on this node
# are done by hand, with a controlled reboot. The rest of proxmox_postinstall
# (repos, nag removal, base packages, timezone) still runs normally.
#
# Flip to true only for a deliberate, supervised upgrade run.
pve_apt_upgrade: false

# ── pve-exporter LXC (job `pve`) ───────────────────────────────────────────
# The PVE REST-API exporter runs as a lightweight LXC ON this node (it used to be a
# Docker container on the rpi5 hub). The hub's Prometheus scrapes it at
# pve_exporter_lxc_ip:9221. Full knob list + defaults in
# roles/pve_exporter_lxc/defaults/main.yml — only the network is set here.
#
# IMPORTANT: pve_exporter_lxc_ip MUST be a FREE LAN address and MUST match the `pve`
# job's __address__ replacement in core/prometheus/prometheus.yml.
pve_exporter_lxc_ip: "192.168.1.15/24"
pve_exporter_lxc_gateway: "192.168.1.1"

# ── CoolerControl fan/PWM control (role `coolercontrol`) ─────────────────────
# Runs on the HOST: nct6687d DKMS driver (MSI Z490 NCT6687-D chip) + the
# CoolerControl daemon with its built-in web UI. Reach the UI at
# http://192.168.1.14:11987 once bootstrapped. Full knob list in
# roles/coolercontrol/defaults/main.yml — defaults are fine for this board.
#
# NOTE: if nct6683 was already bound to the chip, the first run can't load nct6687
# until a reboot. Reboot the node once and re-run `--tags coolercontrol`.

# ── Dev VM (roles dev_vm_template + dev_vm, playbook provision-dev-vm.yml) ────
# These describe the VM the pve node builds. They live here (not in group_vars/dev.yml)
# because the roles that consume them run WHILE connected to the pve host — the same
# reason the pve-exporter LXC knobs are in this file. Full knob list + defaults in
# roles/dev_vm{,_template}/defaults/main.yml; only the site-specific bits are set here.
#
# IMPORTANT: dev_vm_ip MUST match the `dev-vm` host's ansible_host in inventory/hosts.yml.
dev_vm_ip: "192.168.1.16/24"      # next free LAN address (the pve-exporter LXC holds .15)
dev_vm_gateway: "192.168.1.1"
dev_vm_nameserver: "192.168.1.2"  # the LAN DNS server
dev_vm_memory_mb: 8192            # 8 GB RAM (role default is 16 GB)

# REQUIRED — public keys authorized inside the VM for the `dev` user. Public keys are
# safe to commit (GitHub itself publishes yours at github.com/<user>.keys). Put BOTH so
# everything can reach the box:
#   - your Windows 11 key   → so VSCode Remote-SSH connects (get it on W11 with:
#                             `type $env:USERPROFILE\.ssh\id_ed25519.pub`)
#   - THIS control node's key → so provision-dev-vm.yml's 2nd play (Ansible) connects
#                             (`cat ~/.ssh/id_ed25519.pub` on the rpi5)
# Replace the placeholders below with your real one-line public keys.
dev_vm_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFPFPnG6x6QP5OBpEvQI+mytQyFETzxp9tLx/BqPoES4 negrii@Negrii"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMAVCKiDd4xJNUCOKysqVqI9lvzufr5/l6PwzCXpbmK8 negri@rpi5"
