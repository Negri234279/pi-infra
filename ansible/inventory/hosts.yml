# pi-infra inventory. The control node is the rpi5 itself (runs Ansible locally);
# the managed nodes are reached over the LAN by SSH as root.
#
#   ansible -m ping proxmox
#   ansible-playbook playbooks/bootstrap-pve.yml
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

  children:
    # The observability hub — Ansible runs HERE, so it talks to itself locally.
    hub:
      hosts:
        rpi5:
          ansible_host: 192.168.1.7
          ansible_connection: local

    # The Proxmox VE server. Fresh install → root SSH is enabled; copy your key with
    # `ssh-copy-id root@192.168.1.14` before the first run.
    proxmox:
      vars:
        ansible_user: root
      hosts:
        pve:
          ansible_host: 192.168.1.14
          # 10G Mellanox NIC — informational. On an ISOLATED point-to-point net
          # (10.10.10.0/24, direct link to the W11 box at 10.10.10.11); NOT routable
          # from this hub. Managed over the mgmt NIC (ansible_host) only.
          pve_nic_10g: 10.10.10.10

    # Development workstation VM, created on the pve node by
    # playbooks/provision-dev-vm.yml. It does not exist until that playbook's first
    # play runs; the second play then connects here as the cloud-init user over SSH.
    # ansible_host MUST match dev_vm_ip (group_vars/proxmox.yml), and ansible_user MUST
    # match dev_vm_ci_user.
    dev:
      vars:
        ansible_user: dev
      hosts:
        dev-vm:
          ansible_host: 192.168.1.16

    # TrueNAS SCALE 25.10 "Goldeye" NAS. Bootstrapped by playbooks/bootstrap-truenas.yml.
    # The OS root fs is IMMUTABLE (regenerated on update), so Ansible only talks to the
    # middleware (`midclt`) and the native Docker engine — never apt/`/etc`. Reached over
    # the mgmt NIC (eno1); the 10G enp1s0 @ 10.10.10.13 is on an isolated net and not used
    # for management or scraping. SSH must be enabled (System → Services) with this hub's
    # key authorized for the login below. `truenas_admin` is the default 25.10 admin user;
    # switch ansible_user to root only if you have re-enabled root SSH.
    nas:
      vars:
        ansible_user: truenas_admin
        ansible_become: true          # midclt / docker need root; sudo via the admin user
      hosts:
        truenas:
          ansible_host: 192.168.1.18
          # 10G enp1s0 @ 10.10.10.13 — informational only; isolated net, NOT scraped.
          truenas_nic_10g: 10.10.10.13

    # Existing metrics-only satellite (see hosts/rpi3/). Not targeted by the current
    # playbooks; here so the inventory is complete. Adjust ansible_user to its login.
    satellites:
      vars:
        ansible_user: root
      hosts:
        rpi3:
          ansible_host: 192.168.1.6
