# Ansible config for the pi-infra control node (the rpi5). Run playbooks from THIS
# directory (~/pi-infra/ansible) so these relative paths resolve.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
# timer      → total run time; profile_tasks → per-task duration (the "more detail").
# The Grafana annotations callback is NOT enabled here on purpose: it needs a
# Grafana URL + token and would warn on every plain run. `run.sh` enables it
# on demand (via ANSIBLE_CALLBACKS_ENABLED) when the credentials are present.
callbacks_enabled = timer, profile_tasks
force_color = True

[ssh_connection]
pipelining = True
