# Ansible config for the pi-infra control node (the rpi5). Run playbooks from THIS
# directory (~/pi-infra/ansible) so these relative paths resolve.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callbacks_enabled = timer
force_color = True

[ssh_connection]
pipelining = True
